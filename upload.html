<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Upload Game - Dloads</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; display: flex; gap: 20px; flex-wrap: wrap; margin: 0; box-sizing: border-box; }
        .container { flex: 1; min-width: 320px; background: #0a0a0a; border: 1px solid #333; padding: 20px; box-sizing: border-box; }
        .preview-container { flex: 1; min-width: 320px; background: #0a0a0a; border: 1px solid #333; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; }
        .section-title { font-size: 13px; font-weight: bold; color: #fff; background: #222; padding: 6px 10px; margin: 18px 0 10px 0; border-left: 3px solid #fff; text-transform: uppercase; }
        h2 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        label { display: block; margin-top: 12px; font-size: 12px; color: #aaa; font-weight: bold; text-transform: uppercase; }
        input[type="text"], textarea { width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; margin-top: 5px; box-sizing: border-box; font-size: 13px; }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: #fff; }
        .img-preview { width: 100%; height: 160px; object-fit: cover; border: 1px dashed #444; margin-top: 5px; display: none; background: #111; }
        button { background: #fff; color: #000; font-weight: bold; border: none; padding: 15px; width: 100%; cursor: pointer; margin-top: 20px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: #ccc; }
        button:disabled { background: #555; cursor: not-allowed; color: #888; }
        iframe { width: 100%; flex-grow: 1; border: 1px dashed #555; background: #000; margin-top: 10px; min-height: 450px; }
    </style>
</head>
<body>

<div class="container">
    <h2>UPLOAD GAME CỦA MÀY</h2>
    
    <div class="section-title">1. THÔNG TIN CƠ BẢN</div>
    <label>ID Game (vd: my-game-123)</label>
    <input type="text" id="gId" placeholder="my-game-123">

    <label>Tên Game</label>
    <input type="text" id="gName" placeholder="Nhập tên game..." oninput="updatePreview()">

    <label>Nền Tảng Hỗ Trợ (vd: Windows, Mac, Web)</label>
    <input type="text" id="gPlatforms" placeholder="Windows, Web..." oninput="updatePreview()">

    <label>Dung Lượng (vd: 250 MB)</label>
    <input type="text" id="gSize" placeholder="250 MB" oninput="updatePreview()">

    <label>Link Tải Gốc</label>
    <input type="text" id="gLink" placeholder="https://...">

    <div class="section-title">2. HÌNH ẢNH</div>
    <label>Thumbnail / Ảnh Bìa Game (Bắt buộc)</label>
    <input type="file" id="fileMain" accept="image/*">
    <img id="prevMain" class="img-preview">

    <label>Ảnh Review / Devlog (Tùy chọn)</label>
    <input type="file" id="fileReview" accept="image/*">
    <img id="prevReview" class="img-preview">

    <div class="section-title">3. TỰ TÙY CHỈNH GIAO DIỆN (CSS & HTML)</div>
    <label>Custom CSS (Tự viết style cho trang chi tiết)</label>
    <textarea id="gCss" rows="5" placeholder="body { background: #000; }\n.detail-box { border-color: red; }" oninput="updatePreview()"></textarea>

    <label>Custom HTML (Mô tả game, nhúng video, hình ảnh...)</label>
    <textarea id="gHtml" rows="6" placeholder="<h1>Giới thiệu game</h1>\n<p>Nội dung mô tả game ở đây...</p>" oninput="updatePreview()"></textarea>

    <button id="uploadBtn" onclick="submitToPending()">GỬI YÊU CẦU DUYỆT</button>
</div>

<!-- Bảng Iframe xem trước -->
<div class="preview-container">
    <h2>XEM TRƯỚC GIAO DIỆN</h2>
    <p style="font-size: 12px; color: #888; margin: 0 0 10px 0;">Giao diện chi tiết game sẽ hiển thị trên web như thế này:</p>
    <iframe id="previewFrame"></iframe>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC5LzxgMCOvF01tSMWjoVWt3jjYAnJR394",
        authDomain: "sf2g-bf285.firebaseapp.com",
        projectId: "sf2g-bf285",
        databaseURL: "https://sf2g-bf285-default-rtdb.firebaseio.com",
        storageBucket: "sf2g-bf285.firebasestorage.app",
        messagingSenderId: "982578480996",
        appId: "1:982578480996:web:609acf09d1d5b951299c71",
        measurementId: "G-VD58ECNEPQ"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    let currentUser = null;
    firebase.auth().onAuthStateChanged(user => {
        if (user) { currentUser = user; } 
        else { alert("Đăng nhập để upload!"); window.location.href = "auth.html"; }
    });

    let mainImgBase64 = "";
    let reviewImgBase64 = "";

    // Load & Convert Main Image
    document.getElementById('fileMain').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (ev) => {
            mainImgBase64 = ev.target.result;
            const img = document.getElementById('prevMain');
            img.src = ev.target.result;
            img.style.display = 'block';
            updatePreview();
        };
        r.readAsDataURL(file);
    };

    // Load & Convert Review Image
    document.getElementById('fileReview').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (ev) => {
            reviewImgBase64 = ev.target.result;
            const img = document.getElementById('prevReview');
            img.src = ev.target.result;
            img.style.display = 'block';
            updatePreview();
        };
        r.readAsDataURL(file);
    };

    // Cập nhật Iframe Live Preview
    function updatePreview() {
        const name = document.getElementById('gName').value || 'Tên Game';
        const platforms = document.getElementById('gPlatforms').value || 'Windows';
        const size = document.getElementById('gSize').value || '--';
        const css = document.getElementById('gCss').value;
        const html = document.getElementById('gHtml').value;
        const frame = document.getElementById('previewFrame');
        const devName = currentUser ? currentUser.displayName : 'Dev Name';
        
        const thumbHtml = mainImgBase64 ? `<img src="${mainImgBase64}" style="width:100%;height:220px;object-fit:cover;border:1px solid #333;margin-bottom:15px;">` : '';
        const revHtml = reviewImgBase64 ? `<img src="${reviewImgBase64}" style="width:100%;margin-top:15px;border:1px solid #333;">` : '';

        frame.srcdoc = `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    body { background: #000; color: #fff; font-family: sans-serif; padding: 15px; margin: 0; }
                    .detail-box { background: #0a0a0a; border: 1px solid #222; padding: 20px; }
                    .dev-name { color: #888; font-size: 13px; margin-bottom: 10px; }
                    #customDevContent { padding: 15px; background: rgba(255,255,255,0.03); border: 1px dashed #333; margin-top: 15px; line-height: 1.5; }
                    #customDevContent img { max-width: 100%; }
                    ${css}
                </style>
            </head>
            <body>
                <div class="detail-box">
                    ${thumbHtml}
                    <h2 style="margin:0 0 5px 0;">${name}</h2>
                    <div class="dev-name">A game by <b>${devName}</b> | Nền tảng: ${platforms} | Dung lượng: ${size}</div>
                    
                    <div id="customDevContent">
                        ${html || '<i style="color:#666">Mô tả HTML sẽ hiển thị ở đây...</i>'}
                    </div>

                    ${revHtml}
                </div>
            </body>
            </html>
        `;
    }

    // Đẩy vào database Chờ Duyệt (pending_games)
    async function submitToPending() {
        const id = document.getElementById('gId').value.trim();
        const name = document.getElementById('gName').value.trim();
        
        if(!id || !name) return alert("Điền thiếu ID hoặc Tên Game!");
        if(!mainImgBase64) return alert("Vui lòng chọn Thumbnail / Ảnh Bìa Game!");

        const btn = document.getElementById('uploadBtn');
        btn.innerText = "ĐANG GỬI CỦA MÀY LÊN...";
        btn.disabled = true;

        const pendingData = {
            name: name,
            developer: currentUser ? currentUser.displayName : "Unknown Dev",
            platforms: document.getElementById('gPlatforms').value,
            size: document.getElementById('gSize').value,
            link: document.getElementById('gLink').value,
            img: mainImgBase64,
            reviewImg: reviewImgBase64,
            customCss: document.getElementById('gCss').value,
            customHtml: document.getElementById('gHtml').value
        };

        try {
            await fetch(`https://sf2g-bf285-default-rtdb.firebaseio.com/pending_games/${id}.json`, {
                method: 'PUT',
                body: JSON.stringify(pendingData)
            });
            alert("Đã gửi game thành công! Vui lòng chờ Admin phê duyệt.");
            window.location.href = "/";
        } catch (e) {
            alert("Lỗi khi gửi duyệt!");
            btn.innerText = "GỬI YÊU CẦU DUYỆT";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
