<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Upload Game - Dloads</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; display: flex; gap: 20px; }
        .container { flex: 1; background: #0a0a0a; border: 1px solid #333; padding: 20px; }
        .preview-container { flex: 1; background: #0a0a0a; border: 1px solid #333; padding: 20px; display: flex; flex-direction: column; }
        label { display: block; margin-top: 15px; font-size: 12px; color: #aaa; }
        input, textarea { width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; margin-top: 5px; box-sizing: border-box; }
        button { background: #fff; color: #000; font-weight: bold; border: none; padding: 15px; width: 100%; cursor: pointer; margin-top: 20px; }
        button:hover { background: #ccc; }
        iframe { width: 100%; flex-grow: 1; border: 1px dashed #555; background: #000; margin-top: 10px; min-height: 400px; }
    </style>
</head>
<body>

<div class="container">
    <h2>UPLOAD GAME CỦA MÀY</h2>
    
    <label>ID Game (vd: my-game-123)</label>
    <input type="text" id="gId">

    <label>Tên Game</label>
    <input type="text" id="gName" oninput="updatePreview()">

    <label>Link Tải</label>
    <input type="text" id="gLink">

    <div style="background: #111; border: 1px dashed #00e676; padding: 15px; margin-top: 15px;">
    <label style="color: #00e676; font-size: 14px;">
        <input type="checkbox" id="gIsPaid" onchange="togglePayMode()"> 💰 BẬT CHẾ ĐỘ BÁN GAME (100% TIỀN VỀ DEV)
    </label>
    
    <div id="payFields" style="display: none; margin-top: 10px;">
        <label>Giá bán (Hiển thị trên web)</label>
        <input type="text" id="gPrice" placeholder="vd: 50.000 VNĐ hoặc 5 USD">
        
        <label>Số điện thoại MoMo nhận tiền</label>
        <input type="text" id="gMomo" placeholder="vd: 0912345678">
        
        <label>Link PayPal.Me nhận tiền</label>
        <input type="text" id="gPaypal" placeholder="vd: https://paypal.me/username">

        <label>Link Contact (Nhóm Discord / FB cá nhân để check bill & gửi game)</label>
        <input type="text" id="gContact" placeholder="Bắt buộc phải có để gửi link cho khách">
    </div>
</div>
    
    <label>Custom CSS (Tự custom giao diện)</label>
    <textarea id="gCss" rows="4" placeholder="body { background: red; }" oninput="updatePreview()"></textarea>

    <label>Custom HTML (Mô tả, nhúng ảnh...)</label>
    <textarea id="gHtml" rows="6" placeholder="<h1>Game siêu hay</h1>..." oninput="updatePreview()"></textarea>

    <button id="uploadBtn" onclick="submitToPending()">GỬI YÊU CẦU DUYỆT</button>
</div>

<!-- Bảng Iframe xem trước -->
<div class="preview-container">
    <h2>XEM TRƯỚC GIAO DIỆN</h2>
    <p style="font-size: 12px; color: #888;">Giao diện sẽ hiển thị trên trang chủ như thế này:</p>
    <iframe id="previewFrame"></iframe>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC5LzxgMCOvF01tSMWjoVWt3jjYAnJR394",
        authDomain: "sf2g-bf285.firebaseapp.com",
        projectId: "sf2g-bf285",
        databaseURL: "https://sf2g-bf285-default-rtdb.firebaseio.com",
        storageBucket: "sf2g-bf285.firebasestorage.app",
        messagingSenderId: "982578480996",
        appId: "1:982578480996:web:609acf09d1d5b951299c71",
        measurementId: "G-VD58ECNEPQ"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    let currentUser = null;
    firebase.auth().onAuthStateChanged(user => {
        if (user) { currentUser = user; } 
        else { alert("Đăng nhập để upload!"); window.location.href = "auth.html"; }
    });

    // Cập nhật Iframe Live Preview
    function updatePreview() {
        const name = document.getElementById('gName').value || 'Tên Game';
        const css = document.getElementById('gCss').value;
        const html = document.getElementById('gHtml').value;
        const frame = document.getElementById('previewFrame');
        
        frame.srcdoc = `
            <html>
            <head>
                <style>
                    body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
                    .detail-box { background: #0a0a0a; border: 1px solid #222; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
                    #customDevContent { padding: 15px; background: rgba(0,0,0,0.3); border: 1px dashed #333; margin-top: 20px; }
                    ${css}
                </style>
            </head>
            <body>
                <div class="detail-box">
                    <h2>${name}</h2>
                    <div id="customDevContent">${html}</div>
                </div>
            </body>
            </html>
        `;
    }

    // Đẩy vào database Chờ Duyệt (pending_games)
    async function submitToPending() {
        const id = document.getElementById('gId').value;
        if(!id || !document.getElementById('gName').value) return alert("Điền thiếu ID hoặc Tên!");

        const pendingData = {
            name: document.getElementById('gName').value,
            link: document.getElementById('gLink').value,
            customCss: document.getElementById('gCss').value,
            customHtml: document.getElementById('gHtml').value,
            developer: currentUser ? currentUser.displayName : "Unknown Dev"
        };

        try {
            await fetch(`https://sf2g-bf285-default-rtdb.firebaseio.com/pending_games/${id}.json`, {
                method: 'PUT',
                body: JSON.stringify(pendingData)
            });
            alert("Đã gửi game thành công! Vui lòng chờ Admin phê duyệt.");
            window.location.href = "/";
        } catch (e) {
            alert("Lỗi khi gửi duyệt!");
        }
    }
</script>
</body>
</html>
