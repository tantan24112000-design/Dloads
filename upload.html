<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Upload Game - Dloads</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; display: flex; gap: 20px; flex-wrap: wrap; margin: 0; box-sizing: border-box; }
        .container { flex: 1; min-width: 320px; background: #0a0a0a; border: 1px solid #333; padding: 20px; box-sizing: border-box; }
        .preview-container { flex: 1; min-width: 320px; background: #0a0a0a; border: 1px solid #333; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; }
        .profile-box { display: flex; align-items: center; gap: 15px; background: #111; padding: 15px; border: 1px solid #333; margin-bottom: 20px; }
        .profile-box img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #555; }
        .btn-avatar { background: #333; color: #fff; font-size: 11px; padding: 6px 12px; cursor: pointer; text-transform: uppercase; font-weight: bold; display: inline-block; margin-top: 5px; }
        .btn-avatar:hover { background: #555; }
        .section-title { font-size: 13px; font-weight: bold; color: #fff; background: #222; padding: 6px 10px; margin: 18px 0 10px 0; border-left: 3px solid #fff; text-transform: uppercase; }
        .btn-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; background: #0a0a0a; color: #ccc; border: 1px solid #333; padding: 8px 14px; text-decoration: none; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; letter-spacing: 1px; }
        .btn-back:hover { color: #fff; border-color: #fff; }
        h2 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        label { display: block; margin-top: 12px; font-size: 12px; color: #aaa; font-weight: bold; text-transform: uppercase; }
        input[type="text"], textarea { width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; margin-top: 5px; box-sizing: border-box; font-size: 13px; }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: #fff; }
        .img-preview { width: 100%; height: 160px; object-fit: cover; border: 1px dashed #444; margin-top: 5px; display: none; background: #111; }
        button { background: #fff; color: #000; font-weight: bold; border: none; padding: 15px; width: 100%; cursor: pointer; margin-top: 20px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: #ccc; }
        button:disabled { background: #555; cursor: not-allowed; color: #888; }
        iframe { width: 100%; flex-grow: 1; border: 1px dashed #555; background: #000; margin-top: 10px; min-height: 450px; }
        .dev-readonly { background: #0a0a0a; border: 1px solid #222; color: #00e676; padding: 10px; font-size: 13px; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <a class="btn-back" onclick="window.location.href='/'">← TẤT CẢ GAME</a>

    <h2>UPLOAD GAME CỦA MÀY</h2>

    <div class="profile-box">
        <img id="userAvatar" src="basicavtr.png" alt="Avatar">
        <div>
            <div style="font-size: 14px; color: #aaa;">Hello, <b id="userNameDisplay" style="color:#fff;">...</b></div>
            <label class="btn-avatar" for="avatarUpload">ĐỔI ẢNH ĐẠI DIỆN</label>
            <input type="file" id="avatarUpload" accept="image/*" style="display:none;">
        </div>
    </div>

    <div class="section-title">1. THÔNG TIN CƠ BẢN</div>

    <label id="t_id_lbl">ID Game (vd: my-game-123)</label>
    <input type="text" id="gId" placeholder="my-game-123">

    <label id="t_name_lbl">Tên Game</label>
    <input type="text" id="gName" placeholder="Nhập tên game..." oninput="updatePreview()">

    <label id="t_dev_lbl">Developer (tự động)</label>
    <div class="dev-readonly" id="gDevDisplay">Đang tải...</div>

    <label id="t_plat_lbl">Nền Tảng Hỗ Trợ (vd: Windows, Mac, Web)</label>
    <input type="text" id="gPlatforms" placeholder="Windows, Web..." oninput="updatePreview()">

    <label id="t_size_lbl">Dung Lượng (vd: 250 MB)</label>
    <input type="text" id="gSize" placeholder="250 MB" oninput="updatePreview()">

    <label id="t_link_lbl">Link Tải Gốc</label>
    <input type="text" id="gLink" placeholder="https://...">

    <div class="section-title">2. HÌNH ẢNH</div>
    <label id="t_thumb_lbl">Thumbnail / Ảnh Bìa Game (Bắt buộc)</label>
    <input type="file" id="fileMain" accept="image/*">
    <img id="prevMain" class="img-preview">

    <label id="t_rev_lbl">Ảnh Review / Devlog (Tùy chọn)</label>
    <input type="file" id="fileReview" accept="image/*">
    <img id="prevReview" class="img-preview">

    <div class="section-title">3. TỰ TÙY CHỈNH GIAO DIỆN (CSS & HTML)</div>
    <label id="t_css_lbl">Custom CSS</label>
    <textarea id="gCss" rows="5" placeholder="body { background: #000; }" oninput="updatePreview()"></textarea>

    <label id="t_html_lbl">Custom HTML (Mô tả game, nhúng video...)</label>
    <textarea id="gHtml" rows="6" oninput="updatePreview()"></textarea>

    <button id="uploadBtn" onclick="submitToPending()">GỬI YÊU CẦU DUYỆT</button>
</div>

<div class="preview-container">
    <h2 id="t_prev_title">XEM TRƯỚC GIAO DIỆN</h2>
    <p id="t_prev_desc" style="font-size: 12px; color: #888; margin: 0 0 10px 0;">Giao diện chi tiết game sẽ hiển thị trên web như thế này:</p>
    <iframe id="previewFrame"></iframe>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
    // =========================================================
    // CONFIG
    // =========================================================
    // =========================================================
    // NGÔN NGỮ
    // =========================================================
    const isVi = (navigator.language || navigator.userLanguage || 'en').toLowerCase().startsWith('vi');

    const t = isVi ? {
        title:        'UPLOAD GAME CỦA MÀY',
        change_avt:   'ĐỔI ẢNH ĐẠI DIỆN',
        sec1:         '1. THÔNG TIN CƠ BẢN',
        id_lbl:       'ID Game (vd: my-game-123)',
        id_ph:        'my-game-123',
        name_lbl:     'Tên Game',
        name_ph:      'Nhập tên game...',
        dev_lbl:      'Developer (tự động)',
        plat_lbl:     'Nền Tảng Hỗ Trợ (vd: Windows, Mac, Web)',
        plat_ph:      'Windows, Web...',
        size_lbl:     'Dung Lượng (vd: 250 MB)',
        size_ph:      '250 MB',
        link_lbl:     'Link Tải Gốc',
        sec2:         '2. HÌNH ẢNH',
        thumb_lbl:    'Thumbnail / Ảnh Bìa Game (Bắt buộc)',
        rev_lbl:      'Ảnh Review / Devlog (Tùy chọn)',
        sec3:         '3. TỰ TÙY CHỈNH GIAO DIỆN (CSS & HTML)',
        css_lbl:      'Custom CSS',
        css_ph:       'body { background: #000; }',
        html_lbl:     'Custom HTML (Mô tả game, nhúng video...)',
        btn:          'GỬI YÊU CẦU DUYỆT',
        btn_loading:  'ĐANG GỬI LÊN...',
        prev_title:   'XEM TRƯỚC GIAO DIỆN',
        prev_desc:    'Giao diện chi tiết game sẽ hiển thị trên web như thế này:',
        back:         '← TẤT CẢ GAME',
        if_plat:      'Nền tảng:',
        if_size:      'Dung lượng:',
        if_html:      '${t.if_html}',
        alert_login:  'Đăng nhập để upload!',
        alert_miss:   'Điền thiếu ID hoặc Tên Game!',
        alert_thumb:  'Vui lòng chọn Thumbnail / Ảnh Bìa Game!',
        alert_ok:     'Đã gửi game thành công! Vui lòng chờ Admin phê duyệt.',
        alert_err:    'Lỗi khi gửi duyệt!',
        avt_ok:       'Cập nhật avatar thành công!',
        avt_err:      'Lỗi khi cập nhật avatar!',
        hello:        'Xin chào,',
        dev_loading:  'Đang tải...'
    } : {
        title:        'UPLOAD YOUR GAME',
        change_avt:   'CHANGE AVATAR',
        sec1:         '1. BASIC INFO',
        id_lbl:       'Game ID (e.g. my-game-123)',
        id_ph:        'my-game-123',
        name_lbl:     'Game Name',
        name_ph:      'Enter game name...',
        dev_lbl:      'Developer (auto-filled)',
        plat_lbl:     'Supported Platforms (e.g. Windows, Mac, Web)',
        plat_ph:      'Windows, Web...',
        size_lbl:     'File Size (e.g. 250 MB)',
        size_ph:      '250 MB',
        link_lbl:     'Original Download Link',
        sec2:         '2. IMAGES',
        thumb_lbl:    'Thumbnail / Cover Image (Required)',
        rev_lbl:      'Review / Devlog Image (Optional)',
        sec3:         '3. CUSTOM INTERFACE (CSS & HTML)',
        css_lbl:      'Custom CSS',
        css_ph:       'body { background: #000; }',
        html_lbl:     'Custom HTML (Description, embed video...)',
        btn:          'SUBMIT FOR REVIEW',
        btn_loading:  'SUBMITTING...',
        prev_title:   'LIVE PREVIEW',
        prev_desc:    'The game detail page will look like this on the web:',
        back:         '← ALL GAMES',
        if_plat:      'Platform:',
        if_size:      'Size:',
        if_html:      '<i style="color:#666">HTML description will appear here...</i>',
        alert_login:  'Please login to upload!',
        alert_miss:   'Missing Game ID or Name!',
        alert_thumb:  'Please select a Thumbnail / Cover Image!',
        alert_ok:     'Game submitted! Please wait for Admin approval.',
        alert_err:    'Error submitting for review!',
        avt_ok:       'Avatar updated successfully!',
        avt_err:      'Error updating avatar!',
        hello:        'Hello,',
        dev_loading:  'Loading...'
    };

    // Áp dụng ngôn ngữ vào DOM
    function applyLang() {
        document.querySelector('h2').innerText = t.title;
        document.querySelector('.btn-back').innerText = t.back;
        document.getElementById('t_change_avt').innerText = t.change_avt;
        document.getElementById('userNameDisplay').innerText = t.dev_loading;

        const labels = document.querySelectorAll('.section-title');
        labels[0].innerText = t.sec1;
        labels[1].innerText = t.sec2;
        labels[2].innerText = t.sec3;

        const pairs = [
            ['t_id_lbl', 'id_lbl'], ['t_name_lbl', 'name_lbl'], ['t_dev_lbl', 'dev_lbl'],
            ['t_plat_lbl', 'plat_lbl'], ['t_size_lbl', 'size_lbl'], ['t_link_lbl', 'link_lbl'],
            ['t_thumb_lbl', 'thumb_lbl'], ['t_rev_lbl', 'rev_lbl'],
            ['t_css_lbl', 'css_lbl'], ['t_html_lbl', 'html_lbl']
        ];
        for (const [id, key] of pairs) {
            const el = document.getElementById(id);
            if (el) el.innerText = t[key];
        }

        document.getElementById('gId').placeholder       = t.id_ph;
        document.getElementById('gName').placeholder     = t.name_ph;
        document.getElementById('gPlatforms').placeholder = t.plat_ph;
        document.getElementById('gSize').placeholder     = t.size_ph;
        document.getElementById('gCss').placeholder      = t.css_ph;
        document.getElementById('uploadBtn').innerText    = t.btn;

        const prevTitle = document.getElementById('t_prev_title');
        const prevDesc  = document.getElementById('t_prev_desc');
        if (prevTitle) prevTitle.innerText = t.prev_title;
        if (prevDesc)  prevDesc.innerText  = t.prev_desc;
    }

    document.addEventListener('DOMContentLoaded', applyLang);

    const firebaseConfig = {
        apiKey: "AIzaSyC5LzxgMCOvF01tSMWjoVWt3jjYAnJR394",
        authDomain: "sf2g-bf285.firebaseapp.com",
        projectId: "sf2g-bf285",
        databaseURL: "https://sf2g-bf285-default-rtdb.firebaseio.com",
        storageBucket: "sf2g-bf285.firebasestorage.app",
        messagingSenderId: "982578480996",
        appId: "1:982578480996:web:609acf09d1d5b951299c71"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const SUPABASE_URL      = 'https://djcdgqofyzjtgxijzsgq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_5rLqcMcK5xyuJfj4j8MSSw_obYu5sdM';
    const BUCKET            = 'game-images';

    const SB = {
        apikey:        SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`
    };

    let currentUser  = null;
    let mainImgUrl   = '';
    let reviewImgUrl = '';

    // =========================================================
    // ẢNH COMPRESS + UPLOAD
    // =========================================================
    function compressImage(file, maxSize = 1280, quality = 0.82) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
                    else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    canvas.toBlob(b => b ? resolve(b) : reject(new Error('compress fail')), 'image/jpeg', quality);
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function uploadToStorage(blob, path) {
        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`, {
            method: 'POST',
            headers: { ...SB, 'Content-Type': 'image/jpeg', 'x-upsert': 'true' },
            body: blob
        });
        if (!res.ok) throw new Error(await res.text());
        return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
    }

    async function uploadImageFile(file, path, maxSize = 1280, quality = 0.82) {
        const blob = await compressImage(file, maxSize, quality);
        return uploadToStorage(blob, path);
    }

    // =========================================================
    // PROFILE (SUPABASE)
    // =========================================================
    async function loadProfile(uid) {
        try {
            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/profiles?uid=eq.${encodeURIComponent(uid)}&select=avatar,display_name&limit=1`,
                { headers: { ...SB, Accept: 'application/json' } }
            );
            const rows = await res.json();
            return rows?.[0] || null;
        } catch { return null; }
    }

    async function saveProfile(uid, patch) {
        await fetch(`${SUPABASE_URL}/rest/v1/profiles`, {
            method: 'POST',
            headers: { ...SB, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
            body: JSON.stringify({ uid, ...patch })
        });
    }

    // =========================================================
    // FIREBASE AUTH
    // =========================================================
    firebase.auth().onAuthStateChanged(async user => {
        if (!user) {
            alert(t.alert_login);
            window.location.href = 'auth.html';
            return;
        }

        currentUser = user;

        const devName = user.displayName || 'Unknown Dev';
        document.getElementById('userNameDisplay').innerText = devName;
        document.getElementById('gDevDisplay').innerText = devName;

        const profile = await loadProfile(user.uid);
        const avatar = profile?.avatar || 'basicavtr.png';
        currentUser.customPhoto = avatar;
        document.getElementById('userAvatar').src = avatar;

        updatePreview();
    });

    // ---------- đổi avatar ----------
    document.getElementById('avatarUpload').onchange = async e => {
        const file = e.target.files[0];
        if (!file || !currentUser) return;

        const label = document.getElementById('t_change_avt') || { innerText: '' };

        try {
            const url = await uploadImageFile(file, `avatars/${currentUser.uid}.jpg`, 150, 0.8);
            const finalUrl = `${url}?v=${Date.now()}`;

            await saveProfile(currentUser.uid, {
                display_name: currentUser.displayName || null,
                avatar: finalUrl
            });

            currentUser.customPhoto = finalUrl;
            document.getElementById('userAvatar').src = finalUrl;
            alert(t.avt_ok);
            updatePreview();
        } catch (err) {
            console.error(err);
            alert(t.avt_err);
        }
    };

    // =========================================================
    // BIND GAME IMAGES
    // =========================================================
    function bindGameImage(inputId, previewId, onDone) {
        document.getElementById(inputId).onchange = async e => {
            const file = e.target.files[0];
            if (!file) return;

            const img = document.getElementById(previewId);
            img.src = URL.createObjectURL(file);
            img.style.display = 'block';

            const gameId = (document.getElementById('gId').value.trim() || `tmp-${Date.now()}`)
                .replace(/[^a-zA-Z0-9_-]/g, '_');

            try {
                const url = await uploadImageFile(file, `games/${gameId}-${inputId}-${Date.now()}.jpg`);
                onDone(url);
                updatePreview();
            } catch (err) {
                console.error(err);
                alert('Upload ảnh lỗi!');
            }
        };
    }

    bindGameImage('fileMain',   'prevMain',   url => { mainImgUrl   = url; });
    bindGameImage('fileReview', 'prevReview', url => { reviewImgUrl = url; });

    // =========================================================
    // PREVIEW
    // =========================================================
    function updatePreview() {
        const name      = document.getElementById('gName').value      || 'Tên Game';
        const platforms = document.getElementById('gPlatforms').value  || 'Windows';
        const size      = document.getElementById('gSize').value       || '--';
        const css       = document.getElementById('gCss').value;
        const html      = document.getElementById('gHtml').value;
        const frame     = document.getElementById('previewFrame');

        const devName = currentUser?.displayName || 'Dev Name';
        const devAvt  = currentUser?.customPhoto  || 'basicavtr.png';

        const thumbHtml = mainImgUrl
            ? `<img src="${mainImgUrl}" style="width:100%;height:220px;object-fit:cover;border:1px solid #333;margin-bottom:15px;">`
            : '';
        const revHtml = reviewImgUrl
            ? `<img src="${reviewImgUrl}" style="width:100%;margin-top:15px;border:1px solid #333;">`
            : '';

        frame.srcdoc = `<!DOCTYPE html><html><head><style>
            body { background:#000; color:#fff; font-family:sans-serif; padding:15px; margin:0; }
            .detail-box { background:#0a0a0a; border:1px solid #222; padding:20px; }
            .dev-info { display:flex; align-items:center; gap:10px; color:#888; font-size:13px; margin-bottom:15px; }
            .dev-info img { width:32px; height:32px; border-radius:50%; object-fit:cover; border:1px solid #555; }
            #customDevContent { padding:15px; background:rgba(255,255,255,0.03); border:1px dashed #333; margin-top:15px; line-height:1.5; }
            #customDevContent img { max-width:100%; }
            ${css}
        </style></head><body>
            <div class="detail-box">
                ${thumbHtml}
                <h2 style="margin:0 0 10px 0;">${name}</h2>
                <div class="dev-info">
                    <img src="${devAvt}">
                    <div>A game by <b style="color:#fff;">${devName}</b> | ${t.if_plat} ${platforms} | ${t.if_size} ${size}</div>
                </div>
                <div id="customDevContent">${html || '${t.if_html}'}</div>
                ${revHtml}
            </div>
        </body></html>`;
    }

    // =========================================================
    // GỬI DUYỆT
    // =========================================================
    async function submitToPending() {
        const gameId = document.getElementById('gId').value.trim();
        const name   = document.getElementById('gName').value.trim();

        if (!gameId || !name) return alert(t.alert_miss);
        if (!mainImgUrl)      return alert(t.alert_thumb);

        const btn = document.getElementById('uploadBtn');
        btn.innerText = t.btn_loading;
        btn.disabled  = true;

        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/pending_games`, {
                method: 'POST',
                headers: { ...SB, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
                body: JSON.stringify({
                    id:         gameId,
                    name,
                    developer:  currentUser?.displayName || 'Unknown Dev',
                    dev_uid:    currentUser?.uid          || null,
                    dev_avatar: currentUser?.customPhoto  || 'basicavtr.png',
                    platforms:  document.getElementById('gPlatforms').value,
                    size:       document.getElementById('gSize').value,
                    link:       document.getElementById('gLink').value,
                    img:        mainImgUrl,
                    review_img: reviewImgUrl || null,
                    custom_css: document.getElementById('gCss').value,
                    custom_html:document.getElementById('gHtml').value,
                    status:     'pending'
                })
            });

            if (!res.ok) throw new Error(await res.text());

            alert(t.alert_ok);
            window.location.href = '/';
        } catch (err) {
            console.error(err);
            alert(t.alert_err);
            btn.innerText = t.btn;
            btn.disabled  = false;
        }
    }

    updatePreview();
</script>
</body>
</html>
