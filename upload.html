<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Upload Game - Dloads</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; display: flex; gap: 20px; }
        .container { flex: 1; background: #0a0a0a; border: 1px solid #333; padding: 20px; }
        .preview-container { flex: 1; background: #0a0a0a; border: 1px solid #333; padding: 20px; display: flex; flex-direction: column; }
        label { display: block; margin-top: 15px; font-size: 12px; color: #aaa; }
        input, textarea { width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; margin-top: 5px; box-sizing: border-box; }
        button { background: #fff; color: #000; font-weight: bold; border: none; padding: 15px; width: 100%; cursor: pointer; margin-top: 20px; }
        button:hover { background: #ccc; }
        iframe { width: 100%; flex-grow: 1; border: 1px dashed #555; background: #000; margin-top: 10px; min-height: 400px; }
    </style>
<script>
    // Check trực tiếp ngôn ngữ đang dùng của trình duyệt (vi, en, vi-VN,...)
    window.isVN = (navigator.language || navigator.userLanguage || 'en').toLowerCase().startsWith('vi');
    
    window.applyLanguage = function() {
        document.querySelectorAll('[data-vi]').forEach(el => {
            const text = window.isVN ? el.getAttribute('data-vi') : el.getAttribute('data-en');
            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                el.placeholder = text;
            } else if (el.tagName === 'OPTION') {
                el.innerText = text;
            } else {
                el.innerHTML = text;
            }
        });
        const profileDiv = document.getElementById('userProfile');
        if (profileDiv) profileDiv.title = window.isVN ? "Trang cá nhân của tao" : "My Profile";
    };

    // Chạy ngay khi DOM sẵn sàng
    window.addEventListener('DOMContentLoaded', window.applyLanguage);
</script>
</head>
<body>

<div class="container">
    <h2 data-vi="UPLOAD GAME CỦA MÀY" data-en="UPLOAD YOUR GAME">UPLOAD GAME CỦA MÀY</h2>
    
    <label data-vi="ID Game (vd: my-game-123)" data-en="Game ID (ex: my-game-123)">ID Game (vd: my-game-123)</label>
    <input type="text" id="gId">

    <label data-vi="Tên Game" data-en="Game Name">Tên Game</label>
    <input type="text" id="gName" oninput="updatePreview()">

    <label data-vi="Link Tải" data-en="Download Link">Link Tải</label>
    <input type="text" id="gLink">
    
    <label data-vi="Custom CSS (Tự custom giao diện)" data-en="Custom CSS (Customize UI)">Custom CSS (Tự custom giao diện)</label>
    <textarea id="gCss" rows="4" placeholder="body { background: red; }" oninput="updatePreview()"></textarea>

    <label data-vi="Custom HTML (Mô tả, nhúng ảnh...)" data-en="Custom HTML (Description, images...)">Custom HTML (Mô tả, nhúng ảnh...)</label>
    <textarea id="gHtml" rows="6" placeholder="<h1>Game siêu hay</h1>..." oninput="updatePreview()"></textarea>

    <button id="uploadBtn" onclick="submitToPending()" data-vi="GỬI YÊU CẦU DUYỆT" data-en="SUBMIT FOR APPROVAL">GỬI YÊU CẦU DUYỆT</button>
</div>

<!-- Bảng Iframe xem trước -->
<div class="preview-container">
    <h2 data-vi="XEM TRƯỚC GIAO DIỆN" data-en="LIVE PREVIEW">XEM TRƯỚC GIAO DIỆN</h2>
    <p style="font-size: 12px; color: #888;" data-vi="Giao diện sẽ hiển thị trên trang chủ như thế này:" data-en="This is how it will look on the homepage:">Giao diện sẽ hiển thị trên trang chủ như thế này:</p>
    <iframe id="previewFrame"></iframe>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC5LzxgMCOvF01tSMWjoVWt3jjYAnJR394",
        authDomain: "sf2g-bf285.firebaseapp.com",
        projectId: "sf2g-bf285",
        databaseURL: "https://sf2g-bf285-default-rtdb.firebaseio.com",
        storageBucket: "sf2g-bf285.firebasestorage.app",
        messagingSenderId: "982578480996",
        appId: "1:982578480996:web:609acf09d1d5b951299c71",
        measurementId: "G-VD58ECNEPQ"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);[cite: 3]

    let currentUser = null;
    firebase.auth().onAuthStateChanged(user => {
        if (user) { currentUser = user; } 
        else { alert(window.isVN ? "Đăng nhập để upload!" : "Login to upload!"); window.location.href = "auth.html"; }
    });

    // Cập nhật Iframe Live Preview
    function updatePreview() {
        const name = document.getElementById('gName').value || (window.isVN ? 'Tên Game' : 'Game Name');
        const css = document.getElementById('gCss').value;
        const html = document.getElementById('gHtml').value;
        const frame = document.getElementById('previewFrame');[cite: 3]
        
        frame.srcdoc = `
            <html>
            <head>
                <style>
                    body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
                    .detail-box { background: #0a0a0a; border: 1px solid #222; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
                    #customDevContent { padding: 15px; background: rgba(0,0,0,0.3); border: 1px dashed #333; margin-top: 20px; }
                    ${css}
                </style>
            </head>
            <body>
                <div class="detail-box">
                    <h2>${name}</h2>
                    <div id="customDevContent">${html}</div>
                </div>
            </body>
            </html>
        `;[cite: 3]
    }

    // Đẩy vào database Chờ Duyệt (pending_games)
    async function submitToPending() {
        const id = document.getElementById('gId').value;
        if(!id || !document.getElementById('gName').value) return alert(window.isVN ? "Điền thiếu ID hoặc Tên!" : "Missing ID or Name!");

        const pendingData = {
            name: document.getElementById('gName').value,
            link: document.getElementById('gLink').value,
            customCss: document.getElementById('gCss').value,
            customHtml: document.getElementById('gHtml').value,
            developer: currentUser ? currentUser.displayName : "Unknown Dev"
        };[cite: 3]

        try {
            await fetch(`https://sf2g-bf285-default-rtdb.firebaseio.com/pending_games/${id}.json`, {
                method: 'PUT',
                body: JSON.stringify(pendingData)
            });[cite: 3]
            alert(window.isVN ? "Đã gửi game thành công! Vui lòng chờ Admin phê duyệt." : "Game submitted! Please wait for Admin approval.");
            window.location.href = "/";
        } catch (e) {
            alert(window.isVN ? "Lỗi khi gửi duyệt!" : "Error submitting!");
        }
    }
</script>
</body>
</html>
