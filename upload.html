<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Upload Game - Dloads</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; display: flex; gap: 20px; flex-wrap: wrap; margin: 0; box-sizing: border-box; }
        .container { flex: 1; min-width: 320px; background: #0a0a0a; border: 1px solid #333; padding: 20px; box-sizing: border-box; }
        .preview-container { flex: 1; min-width: 320px; background: #0a0a0a; border: 1px solid #333; padding: 20px; display: flex; flex-direction: column; box-sizing: border-box; }
        
        /* Profile Section CSS */
        .profile-box { display: flex; align-items: center; gap: 15px; background: #111; padding: 15px; border: 1px solid #333; margin-bottom: 20px; border-radius: 5px; }
        .profile-box img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #555; }
        .btn-avatar { background: #333; color: #fff; font-size: 11px; padding: 6px 12px; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 3px; display: inline-block; margin-top: 5px; }
        .btn-avatar:hover { background: #555; }

        .section-title { font-size: 13px; font-weight: bold; color: #fff; background: #222; padding: 6px 10px; margin: 18px 0 10px 0; border-left: 3px solid #fff; text-transform: uppercase; }
        h2 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        label { display: block; margin-top: 12px; font-size: 12px; color: #aaa; font-weight: bold; text-transform: uppercase; }
        input[type="text"], textarea { width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; margin-top: 5px; box-sizing: border-box; font-size: 13px; }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: #fff; }
        .img-preview { width: 100%; height: 160px; object-fit: cover; border: 1px dashed #444; margin-top: 5px; display: none; background: #111; }
        button { background: #fff; color: #000; font-weight: bold; border: none; padding: 15px; width: 100%; cursor: pointer; margin-top: 20px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: #ccc; }
        button:disabled { background: #555; cursor: not-allowed; color: #888; }
        iframe { width: 100%; flex-grow: 1; border: 1px dashed #555; background: #000; margin-top: 10px; min-height: 450px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="t_title">UPLOAD GAME CỦA MÀY</h2>

    <!-- KHUNG HỒ SƠ NGƯỜI DÙNG -->
    <div class="profile-box">
        <img id="userAvatar" src="basicavtr.png" alt="Avatar">
        <div>
            <div style="font-size: 14px; color: #aaa;">Hello, <b id="userNameDisplay" style="color:#fff;">Loading...</b></div>
            <label class="btn-avatar" for="avatarUpload" id="t_change_avt">ĐỔI ẢNH ĐẠI DIỆN</label>
            <input type="file" id="avatarUpload" accept="image/*" style="display:none;">
        </div>
    </div>
    
    <div class="section-title" id="t_sec1">1. THÔNG TIN CƠ BẢN</div>
    <label id="t_id_lbl">ID Game (vd: my-game-123)</label>
    <input type="text" id="gId" placeholder="my-game-123">

    <label id="t_name_lbl">Tên Game</label>
    <input type="text" id="gName" placeholder="Nhập tên game..." oninput="updatePreview()">

    <label id="t_plat_lbl">Nền Tảng Hỗ Trợ (vd: Windows, Mac, Web)</label>
    <input type="text" id="gPlatforms" placeholder="Windows, Web..." oninput="updatePreview()">

    <label id="t_size_lbl">Dung Lượng (vd: 250 MB)</label>
    <input type="text" id="gSize" placeholder="250 MB" oninput="updatePreview()">

    <label id="t_link_lbl">Link Tải Gốc</label>
    <input type="text" id="gLink" placeholder="https://...">

    <div class="section-title" id="t_sec2">2. HÌNH ẢNH</div>
    <label id="t_thumb_lbl">Thumbnail / Ảnh Bìa Game (Bắt buộc)</label>
    <input type="file" id="fileMain" accept="image/*">
    <img id="prevMain" class="img-preview">

    <label id="t_rev_lbl">Ảnh Review / Devlog (Tùy chọn)</label>
    <input type="file" id="fileReview" accept="image/*">
    <img id="prevReview" class="img-preview">

    <div class="section-title" id="t_sec3">3. TỰ TÙY CHỈNH GIAO DIỆN (CSS & HTML)</div>
    <label id="t_css_lbl">Custom CSS (Tự viết style cho trang chi tiết)</label>
    <textarea id="gCss" rows="5" placeholder="body { background: #000; }\n.detail-box { border-color: red; }" oninput="updatePreview()"></textarea>

    <label id="t_html_lbl">Custom HTML (Mô tả game, nhúng video, hình ảnh...)</label>
    <textarea id="gHtml" rows="6" placeholder="" oninput="updatePreview()"></textarea>

    <button id="uploadBtn" onclick="submitToPending()">GỬI YÊU CẦU DUYỆT</button>
</div>

<!-- Bảng Iframe xem trước -->
<div class="preview-container">
    <h2 id="t_prev_title">XEM TRƯỚC GIAO DIỆN</h2>
    <p id="t_prev_desc" style="font-size: 12px; color: #888; margin: 0 0 10px 0;">Giao diện chi tiết game sẽ hiển thị trên web như thế này:</p>
    <iframe id="previewFrame"></iframe>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC5LzxgMCOvF01tSMWjoVWt3jjYAnJR394",
        authDomain: "sf2g-bf285.firebaseapp.com",
        projectId: "sf2g-bf285",
        databaseURL: "https://sf2g-bf285-default-rtdb.firebaseio.com",
        storageBucket: "sf2g-bf285.firebasestorage.app",
        messagingSenderId: "982578480996",
        appId: "1:982578480996:web:609acf09d1d5b951299c71",
        measurementId: "G-VD58ECNEPQ"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    // ==========================================
    // HỆ THỐNG SONG NGỮ (VI / EN)
    // ==========================================
    const isVi = (navigator.language || '').toLowerCase().includes('vi');
    const t = isVi ? {
        title: "UPLOAD GAME CỦA MÀY",
        change_avt: "ĐỔI ẢNH ĐẠI DIỆN",
        sec1: "1. THÔNG TIN CƠ BẢN",
        id_lbl: "ID Game (vd: my-game-123)",
        name_lbl: "Tên Game",
        name_plc: "Nhập tên game...",
        plat_lbl: "Nền Tảng Hỗ Trợ (vd: Windows, Mac, Web)",
        plat_plc: "Windows, Web...",
        size_lbl: "Dung Lượng (vd: 250 MB)",
        link_lbl: "Link Tải Gốc",
        sec2: "2. HÌNH ẢNH",
        thumb_lbl: "Thumbnail / Ảnh Bìa Game (Bắt buộc)",
        rev_lbl: "Ảnh Review / Devlog (Tùy chọn)",
        sec3: "3. TỰ TÙY CHỈNH GIAO DIỆN (CSS & HTML)",
        css_lbl: "Custom CSS (Tự viết style cho trang chi tiết)",
        html_lbl: "Custom HTML (Mô tả game, nhúng video, hình ảnh...)",
        html_plc: "<h1>Giới thiệu game</h1>\n<p>Nội dung mô tả game ở đây...</p>",
        btn: "GỬI YÊU CẦU DUYỆT",
        btn_loading: "ĐANG GỬI LÊN...",
        prev_title: "XEM TRƯỚC GIAO DIỆN",
        prev_desc: "Giao diện chi tiết game sẽ hiển thị trên web như thế này:",
        alert_login: "Đăng nhập để upload!",
        alert_missing: "Điền thiếu ID hoặc Tên Game!",
        alert_thumb: "Vui lòng chọn Thumbnail / Ảnh Bìa Game!",
        alert_ok: "Đã gửi game thành công! Vui lòng chờ Admin phê duyệt.",
        alert_err: "Lỗi khi gửi duyệt!",
        avt_ok: "Cập nhật Avatar thành công!",
        avt_err: "Lỗi khi cập nhật Avatar!",
        if_name: "Tên Game",
        if_plat: "Nền tảng:",
        if_size: "Dung lượng:",
        if_html: "<i style='color:#666'>Mô tả HTML sẽ hiển thị ở đây...</i>"
    } : {
        title: "UPLOAD YOUR GAME",
        change_avt: "CHANGE AVATAR",
        sec1: "1. BASIC INFO",
        id_lbl: "Game ID (e.g., my-game-123)",
        name_lbl: "Game Name",
        name_plc: "Enter game name...",
        plat_lbl: "Supported Platforms (e.g., Windows, Mac, Web)",
        plat_plc: "Windows, Web...",
        size_lbl: "Size (e.g., 250 MB)",
        link_lbl: "Original Download Link",
        sec2: "2. IMAGES",
        thumb_lbl: "Thumbnail / Cover Image (Required)",
        rev_lbl: "Review / Devlog Image (Optional)",
        sec3: "3. CUSTOM INTERFACE (CSS & HTML)",
        css_lbl: "Custom CSS (Style your detail page)",
        html_lbl: "Custom HTML (Game description, embed video, images...)",
        html_plc: "<h1>Game Intro</h1>\n<p>Game description here...</p>",
        btn: "SUBMIT FOR REVIEW",
        btn_loading: "SUBMITTING...",
        prev_title: "LIVE PREVIEW",
        prev_desc: "The game detail page will look like this on the web:",
        alert_login: "Please login to upload!",
        alert_missing: "Missing Game ID or Name!",
        alert_thumb: "Please select a Thumbnail / Cover Image!",
        alert_ok: "Game submitted successfully! Please wait for Admin approval.",
        alert_err: "Error submitting for review!",
        avt_ok: "Avatar updated successfully!",
        avt_err: "Error updating Avatar!",
        if_name: "Game Name",
        if_plat: "Platform:",
        if_size: "Size:",
        if_html: "<i style='color:#666'>HTML description will appear here...</i>"
    };

    // Áp dụng ngôn ngữ
    document.getElementById('t_title').innerText = t.title;
    document.getElementById('t_change_avt').innerText = t.change_avt;
    document.getElementById('t_sec1').innerText = t.sec1;
    document.getElementById('t_id_lbl').innerText = t.id_lbl;
    document.getElementById('t_name_lbl').innerText = t.name_lbl;
    document.getElementById('gName').placeholder = t.name_plc;
    document.getElementById('t_plat_lbl').innerText = t.plat_lbl;
    document.getElementById('gPlatforms').placeholder = t.plat_plc;
    document.getElementById('t_size_lbl').innerText = t.size_lbl;
    document.getElementById('t_link_lbl').innerText = t.link_lbl;
    document.getElementById('t_sec2').innerText = t.sec2;
    document.getElementById('t_thumb_lbl').innerText = t.thumb_lbl;
    document.getElementById('t_rev_lbl').innerText = t.rev_lbl;
    document.getElementById('t_sec3').innerText = t.sec3;
    document.getElementById('t_css_lbl').innerText = t.css_lbl;
    document.getElementById('t_html_lbl').innerText = t.html_lbl;
    document.getElementById('gHtml').placeholder = t.html_plc;
    document.getElementById('uploadBtn').innerText = t.btn;
    document.getElementById('t_prev_title').innerText = t.prev_title;
    document.getElementById('t_prev_desc').innerText = t.prev_desc;

    // ==========================================
    // LOGIC HOẠT ĐỘNG
    // ==========================================
    let currentUser = null;
    firebase.auth().onAuthStateChanged(user => {
        if (user) { 
            currentUser = user; 
            document.getElementById('userNameDisplay').innerText = user.displayName || "Unknown Dev";
            document.getElementById('userAvatar').src = user.photoURL || "basicavtr.png";
            updatePreview(); 
        } else { 
            alert(t.alert_login); window.location.href = "auth.html"; 
        }
    });

    // Hàm thu nhỏ ảnh Avatar để nhẹ Firebase
    function resizeAvatar(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_SIZE = 150;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                } else {
                    if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                // Nén JPEG chất lượng 80%
                callback(canvas.toDataURL('image/jpeg', 0.8));
            }
            img.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }

    // Xử lý đổi Avatar
    document.getElementById('avatarUpload').onchange = (e) => {
        const file = e.target.files[0];
        if (!file || !currentUser) return;
        
        document.getElementById('t_change_avt').innerText = "...";
        
        resizeAvatar(file, async (base64) => {
            try {
                await currentUser.updateProfile({ photoURL: base64 });
                
                // Lưu thêm vào Realtime Database để sau này trang chủ load ra dễ dàng
                await fetch(`https://sf2g-bf285-default-rtdb.firebaseio.com/users/${currentUser.uid}.json`, {
                    method: 'PATCH',
                    body: JSON.stringify({ avatar: base64, displayName: currentUser.displayName })
                });

                document.getElementById('userAvatar').src = base64;
                document.getElementById('t_change_avt').innerText = t.change_avt;
                alert(t.avt_ok);
                updatePreview();
            } catch (err) {
                console.error(err);
                alert(t.avt_err);
                document.getElementById('t_change_avt').innerText = t.change_avt;
            }
        });
    };

    let mainImgBase64 = "";
    let reviewImgBase64 = "";

    document.getElementById('fileMain').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (ev) => {
            mainImgBase64 = ev.target.result;
            const img = document.getElementById('prevMain');
            img.src = ev.target.result;
            img.style.display = 'block';
            updatePreview();
        };
        r.readAsDataURL(file);
    };

    document.getElementById('fileReview').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const r = new FileReader();
        r.onload = (ev) => {
            reviewImgBase64 = ev.target.result;
            const img = document.getElementById('prevReview');
            img.src = ev.target.result;
            img.style.display = 'block';
            updatePreview();
        };
        r.readAsDataURL(file);
    };

    function updatePreview() {
        const name = document.getElementById('gName').value || t.if_name;
        const platforms = document.getElementById('gPlatforms').value || 'Windows';
        const size = document.getElementById('gSize').value || '--';
        const css = document.getElementById('gCss').value;
        const html = document.getElementById('gHtml').value;
        const frame = document.getElementById('previewFrame');
        
        const devName = currentUser ? currentUser.displayName : 'Dev Name';
        const devAvt = (currentUser && currentUser.photoURL) ? currentUser.photoURL : 'basicavtr.png';
        
        const thumbHtml = mainImgBase64 ? `<img src="${mainImgBase64}" style="width:100%;height:220px;object-fit:cover;border:1px solid #333;margin-bottom:15px;">` : '';
        const revHtml = reviewImgBase64 ? `<img src="${reviewImgBase64}" style="width:100%;margin-top:15px;border:1px solid #333;">` : '';

        frame.srcdoc = `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    body { background: #000; color: #fff; font-family: sans-serif; padding: 15px; margin: 0; }
                    .detail-box { background: #0a0a0a; border: 1px solid #222; padding: 20px; }
                    .dev-info { display: flex; align-items: center; gap: 10px; color: #888; font-size: 13px; margin-bottom: 15px; }
                    .dev-info img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #555; }
                    #customDevContent { padding: 15px; background: rgba(255,255,255,0.03); border: 1px dashed #333; margin-top: 15px; line-height: 1.5; }
                    #customDevContent img { max-width: 100%; }
                    ${css}
                </style>
            </head>
            <body>
                <div class="detail-box">
                    ${thumbHtml}
                    <h2 style="margin:0 0 10px 0;">${name}</h2>
                    
                    <div class="dev-info">
                        <img src="${devAvt}">
                        <div>A game by <b style="color:#fff;">${devName}</b> | ${t.if_plat} ${platforms} | ${t.if_size} ${size}</div>
                    </div>
                    
                    <div id="customDevContent">
                        ${html || t.if_html}
                    </div>

                    ${revHtml}
                </div>
            </body>
            </html>
        `;
    }

    async function submitToPending() {
        const id = document.getElementById('gId').value.trim();
        const name = document.getElementById('gName').value.trim();
        
        if(!id || !name) return alert(t.alert_missing);
        if(!mainImgBase64) return alert(t.alert_thumb);

        const btn = document.getElementById('uploadBtn');
        btn.innerText = t.btn_loading;
        btn.disabled = true;

        const pendingData = {
            name: name,
            developer: currentUser ? currentUser.displayName : "Unknown Dev",
            devAvatar: currentUser ? currentUser.photoURL : "basicavtr.png",
            platforms: document.getElementById('gPlatforms').value,
            size: document.getElementById('gSize').value,
            link: document.getElementById('gLink').value,
            img: mainImgBase64,
            reviewImg: reviewImgBase64,
            customCss: document.getElementById('gCss').value,
            customHtml: document.getElementById('gHtml').value
        };

        try {
            await fetch(`https://sf2g-bf285-default-rtdb.firebaseio.com/pending_games/${id}.json`, {
                method: 'PUT',
                body: JSON.stringify(pendingData)
            });
            alert(t.alert_ok);
            window.location.href = "/";
        } catch (e) {
            alert(t.alert_err);
            btn.innerText = t.btn;
            btn.disabled = false;
        }
    }

    window.onload = updatePreview;
</script>
</body>
</html>
