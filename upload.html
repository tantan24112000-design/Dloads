<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Upload Game - Dloads</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #0a0a0a; border: 1px solid #333; padding: 20px; }
        label { display: block; margin-top: 15px; font-size: 12px; color: #aaa; }
        input, textarea { width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; margin-top: 5px; box-sizing: border-box; }
        button { background: #fff; color: #000; font-weight: bold; border: none; padding: 15px; width: 100%; cursor: pointer; margin-top: 20px; }
        button:hover { background: #ccc; }
        
        #confirmBox { display: none; margin-top: 20px; border: 1px solid #00e676; padding: 15px; text-align: center; background: #051a05; }
        #confirmBox button { background: #00e676; color: #000; }
    </style>
</head>
<body>

<div class="container">
    <h2>UPLOAD GAME CỦA MÀY</h2>
    
    <label>ID Game (vd: my-game-123)</label>
    <input type="text" id="gId">

    <label>Tên Game</label>
    <input type="text" id="gName">

    <label>Link Tải</label>
    <input type="text" id="gLink">
    
    <label>Custom CSS (Tự custom giao diện)</label>
    <textarea id="gCss" rows="4" placeholder="body { background: red; }"></textarea>

    <label>Custom HTML (Mô tả, nhúng ảnh...)</label>
    <textarea id="gHtml" rows="6" placeholder="<h1>Game siêu hay</h1>..."></textarea>

    <button id="uploadBtn" onclick="sendToDiscord()">UPLOAD LÊN HỆ THỐNG</button>

    <div id="confirmBox">
        <p>Đã gửi thông báo lên Server Discord! Bấm OK để chính thức xuất bản Game lên Web.</p>
        <button onclick="publishGame()">OK - XUẤT BẢN GAME</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC5LzxgMCOvF01tSMWjoVWt3jjYAnJR394",
        authDomain: "sf2g-bf285.firebaseapp.com",
        projectId: "sf2g-bf285",
        databaseURL: "https://sf2g-bf285-default-rtdb.firebaseio.com",
        storageBucket: "sf2g-bf285.firebasestorage.app",
        messagingSenderId: "982578480996",
        appId: "1:982578480996:web:609acf09d1d5b951299c71",
        measurementId: "G-VD58ECNEPQ"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    let currentUser = null;
    
    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
        } else {
            alert("Mày phải đăng nhập mới được upload game!");
            window.location.href = "auth.html";
        }
    });

    const webhookUrl = "https://discord.com/api/webhooks/1535225145415831672/w4Tv5LsdHIliNrE76xAeALA1_2FcZXcw4eH4r02e-v5EnuYIYMTSVEonHOYMSlfQr5JY";
    const dbUrl = "https://sf2g-bf285-default-rtdb.firebaseio.com/games";
    
    let gameDataDraft = {};

    async function sendToDiscord() {
        const id = document.getElementById('gId').value;
        const name = document.getElementById('gName').value;
        if(!id || !name) return alert("Điền thiếu thông tin kìa!");

        gameDataDraft = {
            name: name,
            link: document.getElementById('gLink').value,
            customCss: document.getElementById('gCss').value,
            customHtml: document.getElementById('gHtml').value,
            developer: currentUser ? currentUser.displayName : "Unknown Dev"
        };

        const payload = {
            content: `🚀 **Một game mới vừa được Upload!**`,
            embeds: [{
                title: name,
                description: `ID: ${id}\nĐang chờ xác nhận xuất bản.\nDev: ${gameDataDraft.developer}`,
                color: 5814783
            }]
        };

        try {
            await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            document.getElementById('uploadBtn').style.display = 'none';
            document.getElementById('confirmBox').style.display = 'block';
        } catch (e) {
            alert("Lỗi gửi Webhook!");
        }
    }

    async function publishGame() {
        const id = document.getElementById('gId').value;
        try {
            await fetch(`${dbUrl}/${id}.json`, {
                method: 'PUT',
                body: JSON.stringify(gameDataDraft)
            });
            alert("Game đã lên sóng thành công!");
            window.location.href = "index.html";
        } catch (e) {
            alert("Lỗi lưu DB!");
        }
    }
</script>
</body>
</html>
