<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Upload Game - Dloads</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .box { border: 1px solid #333; padding: 20px; background: #0a0a0a; border-top: 3px solid #fff; }
        .section-title { font-size: 14px; font-weight: bold; color: #fff; background: #222; padding: 8px 12px; margin: 20px 0 10px 0; border-left: 4px solid #fff; text-transform: uppercase; }
        h2 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 12px; font-size: 20px; text-align: center; letter-spacing: 2px; }
        label { display: block; margin: 12px 0 5px; font-weight: bold; font-size: 12px; color: #aaa; text-transform: uppercase; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; margin-bottom: 8px; box-sizing: border-box; font-size: 13px; transition: 0.2s; }
        input:focus, textarea:focus { border-color: #fff; outline: none; }
        .img-preview { width: 100%; height: 250px; object-fit: cover; border: 1px dashed #444; margin-top: 8px; display: none; background: #111; }
        button { background: #fff; color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 25px; font-size: 14px; letter-spacing: 1px; transition: 0.2s; }
        button:hover { background: #ccc; }
        button:disabled { background: #555; cursor: not-allowed; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h2>UPLOAD GAME LÊN DLOADS</h2>

            <div class="section-title">1. THÔNG TIN CHÍNH</div>
            <label>ID Game (URL hiển thị, vd: my-super-game)</label>
            <input type="text" id="gId" placeholder="Không dùng dấu cách và ký tự đặc biệt">
            
            <label>Tên Game</label>
            <input type="text" id="gName" placeholder="Tên trò chơi của bạn">
            
            <label>Nền tảng hỗ trợ (vd: Windows, Web, Mac)</label>
            <input type="text" id="gPlatforms" placeholder="Windows, HTML5...">
            
            <label>Thể loại / Tags (vd: Horror, Action, 2D)</label>
            <input type="text" id="gCategory" placeholder="Nhập các thể loại cách nhau bằng dấu phẩy">
            
            <label>Giá (Để trống hoặc ghi 0 nếu miễn phí)</label>
            <input type="number" id="gPrice" placeholder="Mặc định là miễn phí">
            
            <label>Dung Lượng (vd: 500MB, 1.2GB)</label>
            <input type="text" id="gSize" placeholder="Kích thước tệp">
            
            <label>Link Tải Gốc</label>
            <input type="text" id="gLink" placeholder="Google Drive, Mediafire, Itch.io link...">

            <div class="section-title">2. HÌNH ẢNH & MÔ TẢ</div>
            <label>Nội dung Review / Mô tả chi tiết</label>
            <textarea id="gReviewText" rows="5" placeholder="Giới thiệu về cốt truyện, lối chơi, cách điều khiển..."></textarea>

            <label>Ảnh Bìa Game (Bắt buộc)</label>
            <input type="file" id="fileMain" accept="image/*">
            <img id="prevMain" class="img-preview">

            <button id="uploadBtn" onclick="submitToPending()">GỬI YÊU CẦU DUYỆT</button>
        </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5LzxgMCOvF01tSMWjoVWt3jjYAnJR394",
            authDomain: "sf2g-bf285.firebaseapp.com",
            projectId: "sf2g-bf285",
            databaseURL: "[https://sf2g-bf285-default-rtdb.firebaseio.com](https://sf2g-bf285-default-rtdb.firebaseio.com)",
            storageBucket: "sf2g-bf285.firebasestorage.app",
            messagingSenderId: "982578480996",
            appId: "1:982578480996:web:609acf09d1d5b951299c71"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        let currentUser = null;
        firebase.auth().onAuthStateChanged(user => {
            if (user) { currentUser = user; } 
            else { alert("Đăng nhập để upload game!"); window.location.href = "auth.html"; }
        });

        let coverImageBase64 = "";

        // Tự động load và convert ảnh sang dạng Base64
        document.getElementById('fileMain').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = (ev) => {
                coverImageBase64 = ev.target.result;
                const img = document.getElementById('prevMain');
                img.src = ev.target.result;
                img.style.display = 'block';
            };
            r.readAsDataURL(file);
        };

        async function submitToPending() {
            const id = document.getElementById('gId').value.trim();
            const name = document.getElementById('gName').value.trim();

            if(!id || !name) return alert("Không được bỏ trống ID và Tên Game!");
            if(!coverImageBase64) return alert("Mày phải tải lên ảnh bìa cho game!");

            const pendingData = {
                name: name,
                developer: currentUser ? currentUser.displayName : "Unknown Dev",
                platforms: document.getElementById('gPlatforms').value,
                category: document.getElementById('gCategory').value,
                price: document.getElementById('gPrice').value,
                size: document.getElementById('gSize').value,
                link: document.getElementById('gLink').value,
                reviewText: document.getElementById('gReviewText').value,
                img: coverImageBase64
            };

            const btn = document.getElementById('uploadBtn');
            try {
                btn.innerText = "ĐANG TẢI DỮ LIỆU LÊN...";
                btn.disabled = true;

                await fetch(`[https://sf2g-bf285-default-rtdb.firebaseio.com/pending_games/$](https://sf2g-bf285-default-rtdb.firebaseio.com/pending_games/$){id}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(pendingData)
                });
                
                alert("Đã gửi game thành công! Vui lòng chờ Admin duyệt.");
                window.location.href = "/";
            } catch (e) {
                alert("Đã có lỗi xảy ra khi gửi yêu cầu!");
                btn.innerText = "GỬI YÊU CẦU DUYỆT";
                btn.disabled = false;
            }
        }
    </script>
</body>
