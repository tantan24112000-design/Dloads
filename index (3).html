<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tải Game Tốc Độ Cao</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { border: 1px solid #333; padding: 40px; text-align: center; width: 350px; }
        .thumb { width: 100%; height: 200px; background: #222; border: 1px solid #555; margin-bottom: 20px; object-fit: cover; }
        h1 { font-size: 22px; margin: 0 0 10px; }
        p { color: #888; margin-bottom: 30px; }
        .btn { display: block; background: #fff; color: #000; padding: 15px; text-decoration: none; font-weight: bold; font-size: 16px; border: 1px solid #fff; transition: 0.3s; }
        .btn:hover { background: #000; color: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <img id="gThumb" class="thumb" src="" alt="Game Image" style="display:none;">
        <h1 id="gName">Đang tải dữ liệu...</h1>
        <p id="gSize">Dung lượng: --</p>
        <a href="#" id="gLink" class="btn" style="display:none;">TẢI GAME NGAY</a>
    </div>

    <script>
        const dbUrl = "https://sf2g-bf285-default-rtdb.firebaseio.com";
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        if (id) {
            fetch(`${dbUrl}/games/${id}.json`)
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        document.getElementById('gName').innerText = data.name;
                        document.getElementById('gSize').innerText = "Dung lượng: " + data.size;
                        document.getElementById('gThumb').src = data.img;
                        document.getElementById('gThumb').style.display = 'block';
                        
                        const linkBtn = document.getElementById('gLink');
                        
                        // MÀY ĐỔI ĐƯỜNG LINK NÀY THÀNH LINK VERCEL CỦA BƯỚC 1
                        const urlWebNhiemVu = "https://web-nhap-code.vercel.app";
                        
                        linkBtn.href = `${urlWebNhiemVu}/?id=${id}`;
                        linkBtn.style.display = 'block';
                    } else {
                        document.getElementById('gName').innerText = "Không tìm thấy Game!";
                    }
                });
        }
    </script>
</body>
</html>
