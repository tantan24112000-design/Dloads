<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Unloads</title>
    <link rel="icon" type="image/png" href="logo3.png">
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        :root { --g: #00e676; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .wrap {
            text-align: center;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 26px;
        }
        .brand-icon {
            width: 42px;
            height: 42px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            flex-shrink: 0;
        }
        .brand-name {
            font-size: 32px;
            letter-spacing: 3px;
            font-weight: 900;
            margin: 0;
        }
        .error-code {
            font-size: 14px;
            letter-spacing: 4px;
            color: #888;
            text-transform: uppercase;
            margin: 0 0 26px 0;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0a0a0a;
            color: #ccc;
            border: 1px solid #333;
            padding: 10px 18px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            border-radius: 999px;
            transition: 0.2s;
        }
        .btn-back:hover { color: var(--g); border-color: var(--g); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="logo-row">
            <svg class="brand-icon" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="3" stroke="#fff" fill="#000"/>
                <path d="M12 7v7m0 0l-3-3m3 3l3-3M8 17h8" stroke="#fff" stroke-linecap="round"/>
            </svg>
            <h1 class="brand-name">UNLOADS</h1>
        </div>
        <p class="error-code">ERROR 404</p>
        <a href="/" class="btn-back">← BACK TO HOME</a>
    </div>
</body>
</html>
