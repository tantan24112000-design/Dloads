<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dloads - Groups</title>
    <link rel="icon" type="image/png" href="logo3.png">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
        :root { --radius-sm: 6px; --radius: 10px; --radius-pill: 999px; }
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { max-width: 900px; margin: 0 auto; animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .header-logo { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 20px; }
        .logo-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .header-logo h1 { font-size: 26px; letter-spacing: 3px; margin: 0; font-weight: 900; }
        .brand-icon { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 2; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-link { color: #888; text-decoration: none; font-size: 13px; font-weight: bold; transition: 0.2s; background: #111; padding: 8px 12px; border: 1px solid #333; border-radius: var(--radius-pill); }
        .nav-link:hover { color: #fff; border-color: #fff; }
        .controls-wrap { margin-bottom: 25px; }
        .controls-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-input { flex: 1; background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 12px 15px; font-size: 13px; outline: none; transition: 0.2s; border-radius: var(--radius-pill); }
        .search-input:focus { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.1); }
        .sort-select { background: #0a0a0a; border: 1px solid #333; color: #888; padding: 0 15px; font-size: 12px; outline: none; cursor: pointer; text-transform: uppercase; transition: 0.2s; border-radius: var(--radius-pill); }
        .sort-select:focus { border-color: #fff; color: #fff; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        @media (min-width: 768px) { .game-grid { grid-template-columns: repeat(3, 1fr); } }
        .game-card { background: #0a0a0a; border: 1px solid #222; padding: 15px; text-align: left; display: flex; flex-direction: column; transition: all 0.25s ease; position: relative; overflow: hidden; border-radius: var(--radius); }
        .game-card:hover { transform: translateY(-5px); border-color: #fff; box-shadow: 0 8px 25px rgba(255,255,255,0.05); }
        .game-card img { width: 100%; height: 145px; object-fit: cover; border: 1px solid #222; margin-bottom: 12px; transition: opacity 0.2s; border-radius: var(--radius-sm); }
        .game-card:hover img { opacity: 0.9; }
        .card-badge { position: absolute; top: 20px; right: 20px; background: #fff; color: #000; font-size: 9px; font-weight: bold; padding: 2px 6px; text-transform: uppercase; letter-spacing: 1px; z-index: 15; border-radius: var(--radius-sm); }

        .card-view-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 22;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            color: #000;
            border: 1px solid #fff;
            border-radius: var(--radius-pill);
            padding: 7px 14px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            cursor: pointer;
            transition: padding 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .card-view-btn svg { width: 12px; height: 12px; stroke: currentColor; flex-shrink: 0; }
        .card-view-btn .cv-label {
            display: inline-block;
            max-width: 40px;
            overflow: hidden;
            transition: max-width 0.3s ease, opacity 0.2s ease, margin 0.3s ease;
            opacity: 1;
        }
        .game-card:hover .card-view-btn {
            padding: 7px 9px;
            transform: translateX(14px);
        }
        .game-card:hover .card-view-btn .cv-label {
            max-width: 0;
            opacity: 0;
            margin: 0;
        }
        .game-title { font-size: 16px; margin: 0 0 4px 0; letter-spacing: 0.5px; }
        .dev-name { color: #888; font-size: 12px; margin: 0 0 10px 0; font-style: italic; }
        .platforms { margin-bottom: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
        .plat-badge { font-size: 9px; border: 1px solid #444; padding: 2px 5px; color: #aaa; text-transform: uppercase; background: #111; border-radius: var(--radius-sm); }
        .category-tag { background: #111; border: 1px solid #333; color: #fff; font-size: 10px; padding: 3px 8px; display: inline-block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; border-radius: var(--radius-sm); }
        .row-divider { grid-column: 1 / -1; height: 1px; background: #2a2a2a; width: 85%; margin: 15px auto; }
        .fake-price { text-decoration: line-through; color: #ff4444; font-size: 13px; margin-right: 8px; opacity: 0.8; }
        .free-badge { color: #00e676; font-weight: bold; font-size: 14px; letter-spacing: 1px; }

        .btn { display: block; background: #fff; color: #000; text-decoration: none; padding: 12px; font-weight: bold; font-size: 13px; border: 1px solid #fff; text-align: center; transition: 0.2s; letter-spacing: 1px; cursor: pointer; margin-top: auto; position: relative; z-index: 20; pointer-events: auto; border-radius: var(--radius-pill); }
        .btn:hover { background: #000; color: #fff; box-shadow: inset 0 0 0 1px #fff; }

        .btn-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; background: #0a0a0a; color: #ccc; border: 1px solid #333; padding: 8px 14px; text-decoration: none; font-size: 12px; transition: 0.2s; border-radius: var(--radius-pill); }
        .btn-back:hover { color: #fff; border-color: #fff; }
        .btn-icon { display: flex; align-items: center; justify-content: center; background: #111; border: 1px solid #333; width: 42px; cursor: pointer; transition: 0.2s; color: #fff; border-radius: 50%; }
        .btn-icon:hover { border-color: #fff; }
        .detail-box { background: #0a0a0a; border: 1px solid #222; padding: 30px; text-align: left; max-width: 650px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-radius: var(--radius); }
        .detail-box > img { width: 100%; height: 300px; object-fit: cover; border: 1px solid #333; margin-bottom: 18px; border-radius: var(--radius-sm); }
        .creator-info { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 15px; }
        #customDevContent { margin-bottom: 25px; line-height: 1.6; color: #ddd; font-size: 15px; padding: 15px; background: rgba(0,0,0,0.3); border: 1px dashed #333; border-radius: var(--radius-sm); }
        #customDevContent img { max-width: 100%; height: auto; border: 1px solid #333; border-radius: var(--radius-sm); }
        .action-container { background: #111; padding: 20px; border: 1px solid #333; margin-bottom: 20px; border-radius: var(--radius); }
        .action-row { display: flex; gap: 10px; }
        .action-row .btn { margin-top: 0; flex: 1; }
        .support-text { font-size: 11px; text-align: center; color: #888; margin-bottom: 15px; font-style: italic; }
        .review-box { margin-top: 30px; border-top: 1px dashed #333; padding-top: 20px; }
        .stars { color: #fff; letter-spacing: 4px; font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .review-img { width: 100%; height: auto; border: 1px solid #333; margin-top: 12px; border-radius: var(--radius-sm); }
        .recommend-sec { margin-top: 40px; border-top: 1px solid #222; padding-top: 25px; }
        .recommend-title { font-size: 13px; letter-spacing: 2px; color: #888; margin-bottom: 15px; text-transform: uppercase; }
        .recommend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .rec-card { background: #111; border: 1px solid #222; padding: 8px; text-decoration: none; color: #fff; font-size: 11px; text-align: center; transition: 0.2s; border-radius: var(--radius-sm); }
        .rec-card:hover { border-color: #fff; }
        .rec-card img { width: 100%; height: 70px; object-fit: cover; margin-bottom: 5px; border-radius: var(--radius-sm); }
        .loader { text-align: center; color: #555; font-size: 12px; letter-spacing: 2px; padding: 40px; animation: pulse 1s infinite alternate; text-transform: uppercase; }

        .review-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.96);
            z-index: 10;
            transform: translateY(-101%);
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            border-bottom: 2px solid #fff;
            pointer-events: none;
        }

        .game-card:hover .review-panel {
            transform: translateY(0);
        }

        .review-panel img.rev-img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border: 1px solid #333;
            margin: 0 0 10px 0;
            border-radius: 2px;
            opacity: 1 !important;
        }

        .review-panel-title {
            color: #00e676;
            font-size: 11px;
            font-weight: bold;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .review-panel-text {
            color: #ccc;
            font-size: 12px;
            line-height: 1.5;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-style: italic;
        }

        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .spin-loader {
            width: 50px;
            height: 50px;
            border: 5px solid #222;
            border-top: 5px solid #00e676;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner-overlay { transition: opacity 0.25s ease; }
        .spinner-overlay.hiding { opacity: 0; pointer-events: none; }

        .game-card img, .rec-card img, .review-panel img.rev-img, #gThumb, #rImg {
            background: linear-gradient(100deg, #0a0a0a 30%, #161616 50%, #0a0a0a 70%);
            background-size: 200% 100%;
            animation: shimmer 1.4s ease-in-out infinite;
        }
        .game-card img.img-loaded, .rec-card img.img-loaded, .review-panel img.rev-img.img-loaded, #gThumb.img-loaded, #rImg.img-loaded {
            animation: none;
            background: none;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .btn, .btn-icon { transition: 0.2s ease, transform 0.1s ease; }
        .btn:active, .btn-icon:active { transform: scale(0.96); }

        .game-grid { transition: opacity 0.15s ease; }
        .game-grid.is-updating { opacity: 0.4; }

        .detail-box { animation: heroReveal 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes heroReveal {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: none; }
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: #fff;
            color: #000;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 10px 18px;
            border: 1px solid #fff;
            opacity: 0;
            transform: translateY(10px);
            animation: toastIn 0.25s ease forwards, toastOut 0.25s ease 1.8s forwards;
        }
        @keyframes toastIn { to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateY(-6px); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        }

        .comment-section { margin-top: 40px; border-top: 1px solid #222; padding-top: 25px; }
        .comment-title { font-size: 13px; letter-spacing: 2px; color: #888; margin-bottom: 15px; text-transform: uppercase; }

        .comment-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #333; object-fit: cover; flex-shrink: 0; background: #111; }

        .comment-composer { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .comment-input-wrap { flex: 1; min-width: 0; }
        .comment-input { width: 100%; box-sizing: border-box; background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 10px 16px; font-size: 13px; font-family: inherit; outline: none; border-radius: 20px; transition: 0.2s; }
        .comment-input:focus { border-color: #fff; }
        .comment-post-btn { background: #fff; color: #000; border: 1px solid #fff; padding: 9px 16px; font-weight: bold; font-size: 12px; border-radius: 20px; cursor: pointer; transition: 0.2s, transform 0.1s ease; flex-shrink: 0; }
        .comment-post-btn:hover { background: #000; color: #fff; }
        .comment-post-btn:active { transform: scale(0.96); }
        .comment-post-btn:disabled { opacity: 0.4; cursor: default; }

        .comment-locked { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #0a0a0a; border: 1px solid #222; border-radius: 20px; padding: 12px 18px; color: #888; font-size: 13px; margin-bottom: 10px; }
        .comment-login-link { color: #fff; font-weight: bold; text-decoration: none; border-bottom: 1px solid #fff; flex-shrink: 0; }

        .comment-list { margin-top: 15px; display: flex; flex-direction: column; gap: 18px; }
        .comment-item { display: flex; gap: 12px; }
        .comment-body { flex: 1; min-width: 0; }
        .comment-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; flex-wrap: wrap; }
        .comment-name { font-weight: bold; font-size: 13px; color: #fff; letter-spacing: 0.5px; }
        .comment-time { font-size: 11px; color: #888; }
        .comment-text { font-size: 13px; color: #ddd; line-height: 1.5; margin: 0 0 6px 0; word-break: break-word; }
        .comment-actions { display: flex; align-items: center; gap: 18px; }
        .comment-like-btn { display: flex; align-items: center; gap: 5px; background: none; border: none; color: #888; font-size: 11px; cursor: pointer; padding: 0; transition: 0.15s; }
        .comment-like-btn svg { width: 15px; height: 15px; stroke: #888; fill: none; transition: 0.15s; }
        .comment-like-btn:hover { color: #fff; }
        .comment-like-btn:hover svg { stroke: #fff; }
        .comment-like-btn.liked { color: #fff; }
        .comment-like-btn.liked svg { stroke: #fff; fill: #fff; }
        .comment-reply-btn { background: none; border: none; color: #888; font-size: 11px; font-weight: bold; cursor: pointer; padding: 0; letter-spacing: 0.5px; text-transform: uppercase; transition: 0.15s; }
        .comment-reply-btn:hover { color: #fff; }

        .comment-reply-composer { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .comment-reply-composer .comment-avatar { width: 28px; height: 28px; }
        .comment-reply-composer .comment-input { padding: 8px 14px; font-size: 12px; }
        .comment-reply-composer .comment-post-btn { padding: 7px 14px; font-size: 11px; }

        .comment-replies { margin-top: 14px; margin-left: 48px; display: flex; flex-direction: column; gap: 14px; border-left: 1px solid #1a1a1a; padding-left: 16px; }
        .comment-replies .comment-avatar { width: 28px; height: 28px; }
        /* ===== DLOADS FX (bản gọn) ===== */
        :root { --radius-sm: 2px; --radius: 3px; --radius-pill: 2px; --g: #00e676; }

        ::selection { background: var(--g); color: #000; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #222; border: 2px solid #050505; }
        ::-webkit-scrollbar-thumb:hover { background: var(--g); }
        :focus-visible { outline: 1px solid var(--g); outline-offset: 3px; }

        .game-card:hover { border-color: var(--g); box-shadow: 0 8px 25px rgba(0,230,118,.08); }
        .review-panel { border-bottom-color: var(--g); }

        .btn:hover { background: var(--g); border-color: var(--g); color: #000; box-shadow: none; }
        .nav-link:hover, .btn-back:hover, .btn-icon:hover { border-color: var(--g); color: var(--g); }

        .search-input:focus, .comment-input:focus { border-color: var(--g); box-shadow: 0 0 0 3px rgba(0,230,118,.12); }

        .rec-card { transition: transform .2s, border-color .2s; }
        .rec-card:hover { transform: translateY(-3px); border-color: var(--g); }

        .comment-like-btn.liked svg { animation: fxHeart .4s cubic-bezier(.34,1.56,.64,1); }
        @keyframes fxHeart { 40% { transform: scale(1.4); } }

        /* ===================== GROUPS: FEED ===================== */
        .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
        .group-card { background: #0a0a0a; border: 1px solid #222; border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: 0.2s; text-decoration: none; color: #fff; position: relative; }
        .group-card:hover { border-color: var(--g); transform: translateY(-3px); }
        .group-card-head { display: flex; align-items: center; gap: 12px; }
        .group-card-icon { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 1px solid #333; background: #111; flex-shrink: 0; }
        .group-card-name { font-size: 15px; font-weight: bold; letter-spacing: 0.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .group-card-owner { font-size: 11px; color: #888; font-style: italic; }
        .group-card-desc { font-size: 12px; color: #bbb; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 0; min-height: 36px; }
        .group-card-banned { position: absolute; top: 10px; right: 10px; background: #ff4444; color: #fff; font-size: 9px; font-weight: bold; padding: 3px 7px; border-radius: var(--radius-sm); text-transform: uppercase; letter-spacing: 0.5px; }
        .group-card.is-banned { opacity: 0.45; pointer-events: none; }
        #createGroupBtn { flex-shrink: 0; font-size: 20px; line-height: 1; }

        /* ===================== GROUPS: CREATE MODAL ===================== */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .modal-box { background: #0a0a0a; border: 1px solid #333; border-radius: var(--radius); padding: 24px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .modal-box h3 { margin: 0 0 18px 0; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }
        .modal-box label { display: block; font-size: 11px; color: #888; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; }
        .modal-box input[type="text"], .modal-box textarea { width: 100%; box-sizing: border-box; background: #111; border: 1px solid #333; color: #fff; padding: 10px 14px; font-size: 13px; font-family: inherit; outline: none; border-radius: var(--radius-sm); resize: vertical; transition: 0.2s; }
        .modal-box input[type="text"]:focus, .modal-box textarea:focus { border-color: var(--g); }
        .group-icon-upload { display: flex; align-items: center; gap: 14px; }
        .group-icon-preview { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 1px dashed #444; background: #111; flex-shrink: 0; }
        .group-icon-upload input[type="file"] { flex: 1; font-size: 11px; color: #888; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { margin-top: 0; flex: 1; }
        .btn-secondary { display: block; background: #111; color: #ccc; border: 1px solid #333; padding: 12px; font-weight: bold; font-size: 13px; text-align: center; cursor: pointer; border-radius: var(--radius-pill); flex: 1; transition: 0.2s; }
        .btn-secondary:hover { border-color: #fff; color: #fff; }
        .modal-locked-note { font-size: 12px; color: #888; background: #111; border: 1px solid #222; border-radius: var(--radius-sm); padding: 12px; text-align: center; }
        .modal-locked-note a { color: var(--g); font-weight: bold; text-decoration: none; }

        /* ===================== GROUPS: DISCORD-STYLE VIEW ===================== */
        .discord-shell { display: flex; gap: 1px; background: #1a1a1a; border: 1px solid #222; border-radius: var(--radius); overflow: hidden; height: 72vh; min-height: 460px; }
        .discord-channels { width: 210px; flex-shrink: 0; background: #0a0a0a; display: flex; flex-direction: column; overflow-y: auto; }
        .discord-group-header { display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid #1e1e1e; }
        .discord-group-icon { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid #333; background: #111; flex-shrink: 0; }
        .discord-group-name { font-size: 13px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .discord-channel-list { flex: 1; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
        .discord-channel-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; border-radius: var(--radius-sm); color: #888; font-size: 13px; cursor: pointer; transition: 0.15s; }
        .discord-channel-item:hover { background: #141414; color: #ddd; }
        .discord-channel-item.active { background: #161616; color: var(--g); font-weight: bold; }
        .discord-channel-item .ch-hash { opacity: 0.6; }
        .discord-channel-del { display: none; color: #666; cursor: pointer; font-size: 13px; line-height: 1; padding: 2px 4px; }
        .discord-channel-item:hover .discord-channel-del { display: inline-block; }
        .discord-channel-del:hover { color: #ff4444; }
        .discord-add-channel { padding: 10px; border-top: 1px solid #1e1e1e; }
        .discord-add-channel-btn { width: 100%; background: none; border: 1px dashed #333; color: #888; padding: 8px; font-size: 12px; font-weight: bold; border-radius: var(--radius-sm); cursor: pointer; transition: 0.15s; }
        .discord-add-channel-btn:hover { border-color: var(--g); color: var(--g); }
        .discord-chat { flex: 1; min-width: 0; background: #050505; display: flex; flex-direction: column; }
        .discord-chat-header { padding: 14px 18px; border-bottom: 1px solid #1e1e1e; font-size: 13px; font-weight: bold; color: #ddd; letter-spacing: 0.3px; }
        .discord-messages { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
        .discord-msg { display: flex; gap: 10px; }
        .discord-msg-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid #333; background: #111; flex-shrink: 0; }
        .discord-msg-body { min-width: 0; }
        .discord-msg-head { display: flex; align-items: baseline; gap: 8px; }
        .discord-msg-name { font-size: 13px; font-weight: bold; color: #fff; }
        .discord-msg-time { font-size: 10px; color: #666; }
        .discord-msg-text { font-size: 13px; color: #ddd; line-height: 1.5; margin: 2px 0 0; word-break: break-word; white-space: pre-wrap; }
        .discord-composer { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid #1e1e1e; }
        .discord-composer .comment-input { border-radius: var(--radius-sm); }
        .discord-locked { padding: 16px; text-align: center; font-size: 12px; color: #888; border-top: 1px solid #1e1e1e; }
        .discord-locked a { color: var(--g); font-weight: bold; text-decoration: none; }
        .discord-members { width: 190px; flex-shrink: 0; background: #0a0a0a; padding: 14px 12px; overflow-y: auto; }
        .discord-members-title { font-size: 10px; color: #666; letter-spacing: 1px; margin-bottom: 10px; }
        .discord-member-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: var(--radius-sm); }
        .discord-member-row:hover { background: #141414; }
        .discord-member-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid #333; background: #111; flex-shrink: 0; }
        .discord-member-name { font-size: 12px; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .discord-member-name.is-owner { color: var(--g); }
        .discord-member-crown { font-size: 10px; }
        .discord-member-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .discord-member-actions button { background: none; border: none; color: #666; font-size: 10px; font-weight: bold; cursor: pointer; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
        .discord-member-actions button:hover { color: #fff; background: #222; }
        .discord-member-actions .member-ban-btn:hover { color: #ff4444; }
        .discord-banned-notice { text-align: center; padding: 60px 20px; color: #ff8888; background: #0a0a0a; border: 1px solid #2a0000; border-radius: var(--radius); }

        @media (max-width: 700px) {
            .discord-shell { height: 78vh; }
            .discord-members { display: none; }
            .discord-channels { width: 150px; }
        }
    </style>
</head>
<body>
    <div id="globalSpinner" class="spinner-overlay">
        <div class="spin-loader"></div>
    </div>

    <div class="container">
        <div class="header-logo">
            <div class="logo-wrap" onclick="window.location.href='/'">
                <svg class="brand-icon" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="3" stroke="#fff" fill="#000"/>
                    <path d="M12 7v7m0 0l-3-3m3 3l3-3M8 17h8" stroke="#fff" stroke-linecap="round"/>
                </svg>
                <h1 id="t_mainTitle">DLOADS</h1>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link" data-vi="TRÒ CHƠI" data-en="GAMES">GAMES</a>
                <a href="groups.html" class="nav-link" data-vi="NHÓM" data-en="GROUPS">GROUPS</a>
                <a href="legal.html" class="nav-link" data-vi="ĐIỀU KHOẢN" data-en="TERMS">TERMS</a>
                <a href="upload.html" class="nav-link" id="navUpload" style="background: #fff; color: #000; display: none;" data-vi="ĐĂNG GAME" data-en="UPLOAD GAME">UPLOAD GAME</a>
                <a href="auth.html" class="nav-link" id="navLogin" data-vi="ĐĂNG NHẬP" data-en="LOGIN">LOGIN</a>

                <div id="userProfile" style="display: none; cursor: pointer; margin-left: 10px;">
                    <img id="avatarImg" src="" style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #333; object-fit: cover;">
                </div>
            </div>
        </div>

        <div id="groupsListView" style="display: none;">
            <div class="controls-wrap">
                <div class="controls-bar">
                    <input type="text" id="groupSearchInput" class="search-input" data-vi="Tìm kiếm nhóm..." data-en="Search groups..." placeholder="Search groups...">
                    <button id="createGroupBtn" class="btn-icon" title="Create group">+</button>
                </div>
            </div>
            <div class="group-grid" id="groupGrid"></div>
        </div>

        <div id="groupDetailView" style="display: none;">
            <a href="groups.html" class="btn-back" data-vi="← TẤT CẢ NHÓM" data-en="← ALL GROUPS">← ALL GROUPS</a>
            <div id="gdBannedNotice" class="discord-banned-notice" style="display:none;"></div>
            <div class="discord-shell" id="gdShell">
                <aside class="discord-channels">
                    <div class="discord-group-header">
                        <img id="gdIcon" class="discord-group-icon" src="" alt="">
                        <div class="discord-group-name" id="gdName">--</div>
                    </div>
                    <div class="discord-channel-list" id="gdChannelList"></div>
                    <div class="discord-add-channel" id="gdAddChannelWrap" style="display:none;">
                        <button class="discord-add-channel-btn" id="gdAddChannelBtn" data-vi="+ THÊM KÊNH CHAT" data-en="+ ADD CHANNEL">+ ADD CHANNEL</button>
                    </div>
                </aside>
                <div class="discord-chat">
                    <div class="discord-chat-header" id="gdChannelTitle"># general</div>
                    <div class="discord-messages" id="gdMessages"></div>
                    <div class="discord-composer" id="gdComposerWrap" style="display:none;">
                        <div class="comment-input-wrap">
                            <input type="text" id="gdMsgInput" class="comment-input" maxlength="1000" data-vi="Nhắn gì đó..." data-en="Message..." placeholder="Message...">
                        </div>
                        <button class="comment-post-btn" id="gdMsgSend" data-vi="Gửi" data-en="Send">Send</button>
                    </div>
                    <div class="discord-locked" id="gdLocked" style="display:none;">
                        <span data-vi="Đăng nhập để trò chuyện" data-en="Log in to chat">Log in to chat</span>
                        · <a href="auth.html" data-vi="Đăng nhập" data-en="Log in">Log in</a>
                    </div>
                </div>
                <aside class="discord-members">
                    <div class="discord-members-title"><span data-vi="THÀNH VIÊN" data-en="MEMBERS">MEMBERS</span> — <span id="gdMemberCount">0</span></div>
                    <div class="discord-member-list" id="gdMemberList"></div>
                </aside>
            </div>
        </div>
    </div>

    <div id="createGroupModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3 data-vi="Tạo Nhóm Mới" data-en="Create a Group">Create a Group</h3>

            <div id="groupCreateLoggedOut" class="modal-locked-note" style="display:none;">
                <span data-vi="Đăng nhập để tạo nhóm." data-en="Log in to create a group.">Log in to create a group.</span>
                <a href="auth.html" data-vi="Đăng nhập" data-en="Log in">Log in</a>
            </div>

            <div id="groupCreateForm">
                <label data-vi="Icon nhóm" data-en="Group icon">Group icon</label>
                <div class="group-icon-upload">
                    <img id="groupIconPreview" class="group-icon-preview" src="" alt="">
                    <input type="file" id="groupIconFile" accept="image/*">
                </div>

                <label data-vi="Tên nhóm" data-en="Group name">Group name</label>
                <input type="text" id="groupNameInput" maxlength="60" data-vi="VD: Cộng đồng Dloads" data-en="e.g. Dloads Community" placeholder="e.g. Dloads Community">

                <label data-vi="Mô tả" data-en="Description">Description</label>
                <textarea id="groupDescInput" rows="3" maxlength="300" data-vi="Nhóm này để làm gì..." data-en="What's this group about..." placeholder="What's this group about..."></textarea>

                <div class="modal-actions">
                    <button id="groupCreateSubmit" class="btn" data-vi="Tạo Nhóm" data-en="Create">Create</button>
                    <button id="groupCreateCancel" class="btn-secondary" data-vi="Hủy" data-en="Cancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="groups.js"></script>
</body>
</html>
