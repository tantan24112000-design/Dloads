    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        :root { --radius-sm: 6px; --radius: 10px; --radius-pill: 999px; }
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { max-width: 900px; margin: 0 auto; animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .header-logo { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 20px; }
        .logo-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .header-logo h1 { font-size: 26px; letter-spacing: 3px; margin: 0; font-weight: 900; }
        .brand-icon { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 2; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-link { color: #888; text-decoration: none; font-size: 13px; font-weight: bold; transition: 0.2s; background: #111; padding: 8px 12px; border: 1px solid #333; border-radius: var(--radius-pill); }
        .nav-link:hover { color: #fff; border-color: #fff; }
        .controls-wrap { margin-bottom: 25px; }
        .controls-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-input { flex: 1; background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 12px 15px; font-size: 13px; outline: none; transition: 0.2s; border-radius: var(--radius-pill); }
        .search-input:focus { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.1); }

        .btn { display: block; background: #fff; color: #000; text-decoration: none; padding: 12px; font-weight: bold; font-size: 13px; border: 1px solid #fff; text-align: center; transition: 0.2s; letter-spacing: 1px; cursor: pointer; margin-top: auto; position: relative; z-index: 20; pointer-events: auto; border-radius: var(--radius-pill); }
        .btn:hover { background: #000; color: #fff; box-shadow: inset 0 0 0 1px #fff; }
        .btn-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; background: #0a0a0a; color: #ccc; border: 1px solid #333; padding: 8px 14px; text-decoration: none; font-size: 12px; transition: 0.2s; border-radius: var(--radius-pill); }
        .btn-back:hover { color: #fff; border-color: #fff; }
        .btn-icon { display: flex; align-items: center; justify-content: center; background: #111; border: 1px solid #333; width: 42px; cursor: pointer; transition: 0.2s; color: #fff; border-radius: 50%; }
        .btn-icon:hover { border-color: #fff; }

        /* Vòng tròn xoay loading ở giữa màn hình */
        .spinner-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: flex; justify-content: center; align-items: center; z-index: 99999; transition: opacity 0.25s ease; }
        .spin-loader { width: 50px; height: 50px; border: 5px solid #222; border-top: 5px solid #00e676; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spinner-overlay.hiding { opacity: 0; pointer-events: none; }

        /* Nút: phản hồi khi bấm */
        .btn, .btn-icon { transition: 0.2s ease, transform 0.1s ease; }
        .btn:active, .btn-icon:active { transform: scale(0.96); }

        /* Thông báo nhỏ (thay cho alert) */
        .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 100000; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
        .toast { background: #fff; color: #000; font-size: 12px; font-weight: bold; letter-spacing: 0.5px; padding: 10px 18px; border: 1px solid #fff; opacity: 0; transform: translateY(10px); animation: toastIn 0.25s ease forwards, toastOut 0.25s ease 1.8s forwards; }
        @keyframes toastIn { to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { to { opacity: 0; transform: translateY(-6px); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        }

        /* Composer input/nút dùng chung cho khung chat của nhóm */
        .comment-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #333; object-fit: cover; flex-shrink: 0; background: #111; }
        .comment-input-wrap { flex: 1; min-width: 0; }
        .comment-input { width: 100%; box-sizing: border-box; background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 10px 16px; font-size: 13px; font-family: inherit; outline: none; border-radius: 20px; transition: 0.2s; }
        .comment-input:focus { border-color: #fff; }
        .comment-post-btn { background: #fff; color: #000; border: 1px solid #fff; padding: 9px 16px; font-weight: bold; font-size: 12px; border-radius: 20px; cursor: pointer; transition: 0.2s, transform 0.1s ease; flex-shrink: 0; }
        .comment-post-btn:hover { background: #000; color: #fff; }
        .comment-post-btn:active { transform: scale(0.96); }
        .comment-post-btn:disabled { opacity: 0.4; cursor: default; }

 /* ===== DLOADS FX (bản gọn) ===== */
:root { --radius-sm: 2px; --radius: 3px; --radius-pill: 2px; --g: #00e676; }

::selection { background: var(--g); color: #000; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: #050505; }
::-webkit-scrollbar-thumb { background: #222; border: 2px solid #050505; }
::-webkit-scrollbar-thumb:hover { background: var(--g); }
:focus-visible { outline: 1px solid var(--g); outline-offset: 3px; }

.btn:hover { background: var(--g); border-color: var(--g); color: #000; box-shadow: none; }
.nav-link:hover, .btn-back:hover, .btn-icon:hover { border-color: var(--g); color: var(--g); }
.search-input:focus, .comment-input:focus { border-color: var(--g); box-shadow: 0 0 0 3px rgba(0,230,118,.12); }

/* ===================== GROUPS: FEED ===================== */
.group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
.group-card { background: #0a0a0a; border: 1px solid #222; border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: 0.2s; text-decoration: none; color: #fff; position: relative; }
.group-card:hover { border-color: var(--g); transform: translateY(-3px); }
.group-card-head { display: flex; align-items: center; gap: 12px; }
.group-card-icon { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 1px solid #333; background: #111; flex-shrink: 0; }
.group-card-name { font-size: 15px; font-weight: bold; letter-spacing: 0.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-card-owner { font-size: 11px; color: #888; font-style: italic; }
.group-card-desc { font-size: 12px; color: #bbb; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 0; min-height: 36px; }
.group-card-banned { position: absolute; top: 10px; right: 10px; background: #ff4444; color: #fff; font-size: 9px; font-weight: bold; padding: 3px 7px; border-radius: var(--radius-sm); text-transform: uppercase; letter-spacing: 0.5px; }
.group-card.is-banned { opacity: 0.45; pointer-events: none; }
#createGroupBtn { flex-shrink: 0; font-size: 20px; line-height: 1; }

/* ===================== GROUPS: CREATE MODAL ===================== */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
.modal-box { background: #0a0a0a; border: 1px solid #333; border-radius: var(--radius); padding: 24px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
.modal-box h3 { margin: 0 0 18px 0; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }
.modal-box label { display: block; font-size: 11px; color: #888; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; }
.modal-box input[type="text"], .modal-box textarea { width: 100%; box-sizing: border-box; background: #111; border: 1px solid #333; color: #fff; padding: 10px 14px; font-size: 13px; font-family: inherit; outline: none; border-radius: var(--radius-sm); resize: vertical; transition: 0.2s; }
.modal-box input[type="text"]:focus, .modal-box textarea:focus { border-color: var(--g); }
.group-icon-upload { display: flex; align-items: center; gap: 14px; }
.group-icon-preview { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 1px dashed #444; background: #111; flex-shrink: 0; }
.group-icon-upload input[type="file"] { flex: 1; font-size: 11px; color: #888; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions .btn { margin-top: 0; flex: 1; }
.btn-secondary { display: block; background: #111; color: #ccc; border: 1px solid #333; padding: 12px; font-weight: bold; font-size: 13px; text-align: center; cursor: pointer; border-radius: var(--radius-pill); flex: 1; transition: 0.2s; }
.btn-secondary:hover { border-color: #fff; color: #fff; }
.modal-locked-note { font-size: 12px; color: #888; background: #111; border: 1px solid #222; border-radius: var(--radius-sm); padding: 12px; text-align: center; }
.modal-locked-note a { color: var(--g); font-weight: bold; text-decoration: none; }

/* ===================== GROUPS: DISCORD-STYLE VIEW ===================== */
.discord-shell { display: flex; gap: 1px; background: #1a1a1a; border: 1px solid #222; border-radius: var(--radius); overflow: hidden; height: 72vh; min-height: 460px; }
.discord-channels { width: 210px; flex-shrink: 0; background: #0a0a0a; display: flex; flex-direction: column; overflow-y: auto; }
.discord-group-header { display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid #1e1e1e; }
.discord-group-icon { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid #333; background: #111; flex-shrink: 0; }
.discord-group-name { font-size: 13px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.discord-channel-list { flex: 1; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
.discord-channel-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; border-radius: var(--radius-sm); color: #888; font-size: 13px; cursor: pointer; transition: 0.15s; }
.discord-channel-item:hover { background: #141414; color: #ddd; }
.discord-channel-item.active { background: #161616; color: var(--g); font-weight: bold; }
.discord-channel-item .ch-hash { opacity: 0.6; }
.discord-channel-del { display: none; color: #666; cursor: pointer; font-size: 13px; line-height: 1; padding: 2px 4px; }
.discord-channel-item:hover .discord-channel-del { display: inline-block; }
.discord-channel-del:hover { color: #ff4444; }
.discord-add-channel { padding: 10px; border-top: 1px solid #1e1e1e; }
.discord-add-channel-btn { width: 100%; background: none; border: 1px dashed #333; color: #888; padding: 8px; font-size: 12px; font-weight: bold; border-radius: var(--radius-sm); cursor: pointer; transition: 0.15s; }
.discord-add-channel-btn:hover { border-color: var(--g); color: var(--g); }
.discord-chat { flex: 1; min-width: 0; background: #050505; display: flex; flex-direction: column; }
.discord-chat-header { padding: 14px 18px; border-bottom: 1px solid #1e1e1e; font-size: 13px; font-weight: bold; color: #ddd; letter-spacing: 0.3px; }
.discord-messages { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.discord-msg { display: flex; gap: 10px; }
.discord-msg-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid #333; background: #111; flex-shrink: 0; }
.discord-msg-body { min-width: 0; }
.discord-msg-head { display: flex; align-items: baseline; gap: 8px; }
.discord-msg-name { font-size: 13px; font-weight: bold; color: #fff; }
.discord-msg-time { font-size: 10px; color: #666; }
.discord-msg-text { font-size: 13px; color: #ddd; line-height: 1.5; margin: 2px 0 0; word-break: break-word; white-space: pre-wrap; }
.discord-composer { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid #1e1e1e; }
.discord-composer .comment-input { border-radius: var(--radius-sm); }
.discord-locked { padding: 16px; text-align: center; font-size: 12px; color: #888; border-top: 1px solid #1e1e1e; }
.discord-locked a { color: var(--g); font-weight: bold; text-decoration: none; }
.discord-members { width: 190px; flex-shrink: 0; background: #0a0a0a; padding: 14px 12px; overflow-y: auto; }
.discord-members-title { font-size: 10px; color: #666; letter-spacing: 1px; margin-bottom: 10px; }
.discord-member-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: var(--radius-sm); }
.discord-member-row:hover { background: #141414; }
.discord-member-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid #333; background: #111; flex-shrink: 0; }
.discord-member-name { font-size: 12px; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.discord-member-name.is-owner { color: var(--g); }
.discord-member-crown { font-size: 10px; }
.discord-member-actions { display: flex; gap: 4px; flex-shrink: 0; }
.discord-member-actions button { background: none; border: none; color: #666; font-size: 10px; font-weight: bold; cursor: pointer; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
.discord-member-actions button:hover { color: #fff; background: #222; }
.discord-member-actions .member-ban-btn:hover { color: #ff4444; }
.discord-banned-notice { text-align: center; padding: 60px 20px; color: #ff8888; background: #0a0a0a; border: 1px solid #2a0000; border-radius: var(--radius); }

@media (max-width: 700px) {
    .discord-shell { height: 78vh; }
    .discord-members { display: none; }
    .discord-channels { width: 150px; }
}

    <script>
        window.isVN = (navigator.language || navigator.userLanguage || 'en').toLowerCase().startsWith('vi');

        window.applyLanguage = function() {
            document.querySelectorAll('[data-vi]').forEach(el => {
                const text = window.isVN ? el.getAttribute('data-vi') : el.getAttribute('data-en');
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.placeholder = text;
                } else if (el.tagName === 'OPTION') {
                    el.innerText = text;
                } else {
                    el.innerHTML = text;
                }
            });
            const profileDiv = document.getElementById('userProfile');
            if (profileDiv) profileDiv.title = window.isVN ? "Trang cá nhân của tao" : "My Profile";
        };

        window.addEventListener('DOMContentLoaded', window.applyLanguage);
    </script>

    <script>
        const fConfig = {
            apiKey: "AIzaSyC5LzxgMCOvF01tSMWjoVWt3jjYAnJR394",
            authDomain: "sf2g-bf285.firebaseapp.com",
            projectId: "sf2g-bf285",
            databaseURL: "https://sf2g-bf285-default-rtdb.firebaseio.com",
            storageBucket: "sf2g-bf285.firebasestorage.app",
            messagingSenderId: "982578480996",
            appId: "1:982578480996:web:609acf09d1d5b951299c71",
            measurementId: "G-VD58ECNEPQ"
        };
        if (!firebase.apps.length) firebase.initializeApp(fConfig);

        firebase.auth().onAuthStateChanged(async user => {
            if (user) {
                document.getElementById('navLogin').style.display = 'none';
                document.getElementById('navUpload').style.display = 'block';

                const profileDiv = document.getElementById('userProfile');
                const avaImg = document.getElementById('avatarImg');
                profileDiv.style.display = 'block';

                let dName = user.displayName || "Dev";
                let dAvatar = "basicavtr.png";

                try {
                    const res = await fetch(`https://sf2g-bf285-default-rtdb.firebaseio.com/users/${user.uid}.json`);
                    const data = await res.json();

                    if (data && data.avatar) {
                        dAvatar = data.avatar;
                    }
                } catch (e) {}

                avaImg.src = dAvatar;

                profileDiv.onclick = () => {
                    window.location.href = `/?user=${encodeURIComponent(dName)}`;
                };

                window.setGroupsUser && window.setGroupsUser({ uid: user.uid, name: dName, avatar: dAvatar });
            } else {
                window.setGroupsUser && window.setGroupsUser(null);
            }
        });
    </script>
