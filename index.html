            align-items: center;

            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

            0% { transform: rotate(0deg); }

    <script>
        window.isVN = (navigator.language || navigator.userLanguage || 'en').toLowerCase().startsWith('vi');
        
        window.applyLanguage = function() {
            document.querySelectorAll('[data-vi]').forEach(el => {
                const text = window.isVN ? el.getAttribute('data-vi') : el.getAttribute('data-en');
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.placeholder = text;
                } else if (el.tagName === 'OPTION') {
                    el.innerText = text;
                } else {
                    el.innerHTML = text;
                }
            });
            const profileDiv = document.getElementById('userProfile');
            if (profileDiv) profileDiv.title = window.isVN ? "Trang cá nhân của tao" : "My Profile";
        };

        window.addEventListener('DOMContentLoaded', window.applyLanguage);
    </script>
    <script>
        // ----- Tự chuyển sang trang 404 nếu tải quá lâu hoặc mất mạng -----
        (function () {
            var FALLBACK_URL = '404.html';
            var TIMEOUT_MS = 150;
            var settled = false;

            function goToFallback() {
                if (settled) return;
                settled = true;
                window.location.replace(FALLBACK_URL);
            }

            var watchdogTimer = window.setTimeout(goToFallback, TIMEOUT_MS);

            // Không có mạng ngay khi vừa vào trang (vd: chế độ máy bay, wifi chưa bắt được)
            if ('onLine' in navigator && navigator.onLine === false) {
                goToFallback();
            }

            // Rớt mạng ngay trong lúc trang đang tải
            window.addEventListener('offline', goToFallback);

            // app.js gọi hàm này khi tải dữ liệu xong -> huỷ đồng hồ đếm ngược
            window.markPageLoaded = function () {
                if (settled) return;
                settled = true;
                window.clearTimeout(watchdogTimer);
                window.removeEventListener('offline', goToFallback);
            };

            // app.js gọi hàm này khi tải thất bại hẳn -> chuyển ngay, không cần đợi đủ 15s
            window.markPageLoadFailed = goToFallback;
        })();
    </script>

    <script>
        // Gắn nút "View" vào mỗi game-card (app.js render card thế nào cũng được,
        // script này chỉ theo dõi #gameGrid và tự thêm nút nếu card chưa có).
        (function() {
            const eyeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
            const viewLabel = window.isVN ? 'Xem' : 'View';

            function addViewButtons() {
                document.querySelectorAll('.game-card').forEach(card => {
                    if (card.querySelector('.card-view-btn')) return;
                    const btn = document.createElement('span');
                    btn.className = 'card-view-btn';
                    btn.innerHTML = eyeIcon + '<span class="cv-label">' + viewLabel + '</span>';
                    card.appendChild(btn);
                    btn.style.display = 'none';
                });
            }

            const grid = document.getElementById('gameGrid');
            if (grid) {
                addViewButtons();
                // Chỉ theo dõi card được thêm/xoá trực tiếp trong grid (không dùng
                // subtree) để tránh tự bắt lại thay đổi do chính nút View gây ra.
                new MutationObserver(addViewButtons).observe(grid, { childList: true });
            }
        })();
    </script>
