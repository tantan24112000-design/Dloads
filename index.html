<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dloads - High Speed Games</title>
    <style>
        /* Hiệu ứng nền chuyển động */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body { 
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e); 
            background-size: 400% 400%; 
            animation: gradientBG 15s ease infinite; 
            color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box; 
        }
        
        .container { max-width: 900px; margin: 0 auto; animation: fadeIn 0.8s ease-out; }
        
        h1 { text-align: center; font-size: 32px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 40px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        
        /* Hiệu ứng thẻ Game */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        .game-card { 
            background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(5px); 
            border: 1px solid rgba(255,255,255,0.1); padding: 15px; 
            border-radius: 12px; text-align: center; display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.4);
        }
        .game-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; transition: transform 0.3s ease; }
        .game-card:hover img { transform: scale(1.05); }
        .game-card h3 { font-size: 18px; margin: 5px 0; color: #fff; }
        .game-card p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        
        /* Hiệu ứng Nút bấm */
        .btn { 
            display: block; background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%); 
            color: #000; text-decoration: none; padding: 12px; font-weight: bold; font-size: 14px; 
            border-radius: 6px; transition: 0.3s; text-align: center; text-transform: uppercase;
        }
        .btn:hover { box-shadow: 0 0 15px rgba(0, 201, 255, 0.6); transform: scale(1.02); }
        .btn-back { display: inline-block; margin-bottom: 20px; background: rgba(255,255,255,0.1); color: #fff; width: auto; padding: 10px 20px; border-radius: 6px; }
        .btn-back:hover { background: rgba(255,255,255,0.2); }

        .detail-box { 
            background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 15px;
            text-align: center; max-width: 500px; margin: 0 auto; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .detail-box img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- DANH SÁCH GAME -->
        <div id="listView" style="display: none;">
            <h1 id="t_mainTitle">DLOADS - FREE GAMES</h1>
            <div class="game-grid" id="gameGrid">
                <p id="t_loading" style="grid-column: 1/-1; text-align: center;">Loading game list...</p>
            </div>
        </div>

        <!-- CHI TIẾT GAME -->
        <div id="detailView" style="display: none;">
            <a href="/" class="btn-back" id="t_backBtn">← BACK TO LIST</a>
            <div class="detail-box">
                <img id="gThumb" src="" alt="Thumbnail">
                <h2 id="gName">Loading...</h2>
                <p id="gSize">Size: --</p>
                <a href="#" id="gLink" class="btn"><span id="t_downloadBtn">DOWNLOAD NOW</span></a>
            </div>
        </div>
    </div>

    <script>
        const dbUrl = "https://sf2g-bf285-default-rtdb.firebaseio.com";
        const urlWebNhiemVu = "https://LINK-WEB-NHAP-CODE-CUA-MAY.vercel.app"; // NHỚ THAY LINK NÀY

        // Tự động nhận diện ngôn ngữ
        const userLang = navigator.language || navigator.userLanguage;
        const isVi = userLang.toLowerCase().includes('vi');

        const i18n = {
            vi: {
                title: "DLOADS - KHO GAME MIỄN PHÍ",
                loading: "Đang tải danh sách game...",
                empty: "Chưa có game nào trong kho.",
                size: "Dung lượng:",
                select: "CHỌN GAME NÀY",
                back: "← QUAY LẠI DANH SÁCH",
                download: "TẢI GAME NGAY",
                notFound: "Không tìm thấy game!",
                error: "Lỗi tải dữ liệu!"
            },
            en: {
                title: "DLOADS - FREE GAMES",
                loading: "Loading game list...",
                empty: "No games available.",
                size: "Size:",
                select: "SELECT THIS GAME",
                back: "← BACK TO LIST",
                download: "DOWNLOAD NOW",
                notFound: "Game not found!",
                error: "Data load error!"
            }
        };

        const lang = isVi ? i18n.vi : i18n.en;

        // Cập nhật text tĩnh trên giao diện
        document.getElementById('t_mainTitle').innerText = lang.title;
        document.getElementById('t_loading').innerText = lang.loading;
        document.getElementById('t_backBtn').innerText = lang.back;
        document.getElementById('t_downloadBtn').innerText = lang.download;

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        if (id) {
            document.getElementById('detailView').style.display = 'block';
            fetch(`${dbUrl}/games/${id}.json`)
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        document.getElementById('gName').innerText = data.name;
                        document.getElementById('gSize').innerText = `${lang.size} ${data.size || 'N/A'}`;
                        document.getElementById('gThumb').src = data.img || 'https://via.placeholder.com/500x250?text=No+Image';
                        document.getElementById('gLink').href = `${urlWebNhiemVu}/?id=${id}`;
                    } else {
                        document.getElementById('gName').innerText = lang.notFound;
                    }
                }).catch(() => document.getElementById('gName').innerText = lang.error);
        } else {
            document.getElementById('listView').style.display = 'block';
            fetch(`${dbUrl}/games.json`)
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('gameGrid');
                    grid.innerHTML = '';
                    if (!data) {
                        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center;">${lang.empty}</p>`;
                        return;
                    }
                    for (const gameId in data) {
                        const game = data[gameId];
                        grid.innerHTML += `
                            <div class="game-card">
                                <div>
                                    <img src="${game.img || 'https://via.placeholder.com/300x180?text=No+Image'}" alt="${game.name}">
                                    <h3>${game.name}</h3>
                                    <p>${lang.size} ${game.size || 'N/A'}</p>
                                </div>
                                <a href="?id=${gameId}" class="btn">${lang.select}</a>
                            </div>
                        `;
                    }
                }).catch(() => document.getElementById('gameGrid').innerHTML = `<p style="text-align: center;">${lang.error}</p>`);
        }
    </script>
</body>
</html>
