<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dloads - Indie Game Platform</title>
    <link rel="icon" type="image/png" href="logo3.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        /* CSS gốc của mày giữ nguyên */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { max-width: 900px; margin: 0 auto; animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .header-logo { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 20px; }
        .logo-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .header-logo h1 { font-size: 26px; letter-spacing: 3px; margin: 0; font-weight: 900; }
        .brand-icon { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 2; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-link { color: #888; text-decoration: none; font-size: 13px; font-weight: bold; transition: 0.2s; background: #111; padding: 8px 12px; border: 1px solid #333; }
        .nav-link:hover { color: #fff; border-color: #fff; }
        .controls-wrap { margin-bottom: 25px; }
        .controls-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-input { flex: 1; background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 12px 15px; font-size: 13px; outline: none; transition: 0.2s; }
        .search-input:focus { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.1); }
        .sort-select { background: #0a0a0a; border: 1px solid #333; color: #888; padding: 0 15px; font-size: 12px; outline: none; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .sort-select:focus { border-color: #fff; color: #fff; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        @media (min-width: 768px) { .game-grid { grid-template-columns: repeat(3, 1fr); } }
        .game-card { background: #0a0a0a; border: 1px solid #222; padding: 15px; text-align: left; display: flex; flex-direction: column; transition: all 0.25s ease; position: relative; overflow: hidden; }
        .game-card:hover { transform: translateY(-5px); border-color: #fff; box-shadow: 0 8px 25px rgba(255,255,255,0.05); }
        .game-card img { width: 100%; height: 145px; object-fit: cover; border: 1px solid #222; margin-bottom: 12px; transition: opacity 0.2s; }
        .game-card:hover img { opacity: 0.9; }
        .card-badge { position: absolute; top: 20px; right: 20px; background: #fff; color: #000; font-size: 9px; font-weight: bold; padding: 2px 6px; text-transform: uppercase; letter-spacing: 1px; }
        .game-title { font-size: 16px; margin: 0 0 4px 0; letter-spacing: 0.5px; }
        .dev-name { color: #888; font-size: 12px; margin: 0 0 10px 0; font-style: italic; }
        .platforms { margin-bottom: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
        .plat-badge { font-size: 9px; border: 1px solid #444; padding: 2px 5px; color: #aaa; text-transform: uppercase; background: #111; }
        .category-tag { background: #111; border: 1px solid #333; color: #fff; font-size: 10px; padding: 3px 8px; display: inline-block; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .row-divider { grid-column: 1 / -1; height: 1px; background: #2a2a2a; width: 85%; margin: 15px auto; }
        .fake-price { text-decoration: line-through; color: #ff4444; font-size: 13px; margin-right: 8px; opacity: 0.8; }
        .free-badge { color: #00e676; font-weight: bold; font-size: 14px; letter-spacing: 1px; }
        .btn { display: block; background: #fff; color: #000; text-decoration: none; padding: 12px; font-weight: bold; font-size: 13px; border: 1px solid #fff; text-align: center; transition: 0.2s; letter-spacing: 1px; cursor: pointer; margin-top: auto; }
        .btn:hover { background: #000; color: #fff; box-shadow: inset 0 0 0 1px #fff; }
        .btn-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; background: #0a0a0a; color: #ccc; border: 1px solid #333; padding: 8px 14px; text-decoration: none; font-size: 12px; transition: 0.2s; }
        .btn-back:hover { color: #fff; border-color: #fff; }
        .btn-icon { display: flex; align-items: center; justify-content: center; background: #111; border: 1px solid #333; width: 42px; cursor: pointer; transition: 0.2s; color: #fff; }
        .btn-icon:hover { border-color: #fff; }
        .detail-box { background: #0a0a0a; border: 1px solid #222; padding: 30px; text-align: left; max-width: 650px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .detail-box > img { width: 100%; height: 300px; object-fit: cover; border: 1px solid #333; margin-bottom: 18px; }
        .creator-info { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 15px; }
        #customDevContent { margin-bottom: 25px; line-height: 1.6; color: #ddd; font-size: 15px; padding: 15px; background: rgba(0,0,0,0.3); border: 1px dashed #333; }
        #customDevContent img { max-width: 100%; height: auto; border: 1px solid #333; }
        .action-container { background: #111; padding: 20px; border: 1px solid #333; margin-bottom: 20px; }
        .action-row { display: flex; gap: 10px; }
        .action-row .btn { margin-top: 0; flex: 1; }
        .support-text { font-size: 11px; text-align: center; color: #888; margin-bottom: 15px; font-style: italic; }
        .review-box { margin-top: 30px; border-top: 1px dashed #333; padding-top: 20px; }
        .stars { color: #fff; letter-spacing: 4px; font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .review-img { width: 100%; height: auto; border: 1px solid #333; margin-top: 12px; }
        .recommend-sec { margin-top: 40px; border-top: 1px solid #222; padding-top: 25px; }
        .recommend-title { font-size: 13px; letter-spacing: 2px; color: #888; margin-bottom: 15px; text-transform: uppercase; }
        .recommend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .rec-card { background: #111; border: 1px solid #222; padding: 8px; text-decoration: none; color: #fff; font-size: 11px; text-align: center; transition: 0.2s; }
        .rec-card:hover { border-color: #fff; }
        .rec-card img { width: 100%; height: 70px; object-fit: cover; margin-bottom: 5px; }
        .loader { text-align: center; color: #555; font-size: 12px; letter-spacing: 2px; padding: 40px; animation: pulse 1s infinite alternate; text-transform: uppercase; }
    </style>
    <script>
        window.isVN = true; 
        window.applyLanguage = function() {
            document.querySelectorAll('[data-vi]').forEach(el => {
                const text = window.isVN ? el.getAttribute('data-vi') : el.getAttribute('data-en');
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.placeholder = text;
                } else if (el.tagName === 'OPTION') {
                    el.innerText = text;
                } else {
                    el.innerHTML = text;
                }
            });
            // Handle Profile Tooltip
            const profileDiv = document.getElementById('userProfile');
            if (profileDiv) profileDiv.title = window.isVN ? "Trang cá nhân của tao" : "My Profile";
        };
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                window.isVN = (data.country_code === 'VN');
                window.applyLanguage();
            }).catch(() => window.applyLanguage());
    </script>
</head>
<body>
    <div class="container">
        <div class="header-logo">
            <div class="logo-wrap" onclick="window.location.href='/'">
                <svg class="brand-icon" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="3" stroke="#fff" fill="#000"/>
                    <path d="M12 7v7m0 0l-3-3m3 3l3-3M8 17h8" stroke="#fff" stroke-linecap="round"/>
                </svg>
                <h1 id="t_mainTitle">DLOADS</h1>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link" data-vi="TRÒ CHƠI" data-en="GAMES">GAMES</a>
                <a href="upload.html" class="nav-link" id="navUpload" style="background: #fff; color: #000; display: none;" data-vi="ĐĂNG GAME" data-en="UPLOAD GAME">UPLOAD GAME</a>
                <a href="auth.html" class="nav-link" id="navLogin" data-vi="ĐĂNG NHẬP" data-en="LOGIN">LOGIN</a>
                
                <div id="userProfile" style="display: none; cursor: pointer; margin-left: 10px;">
                    <img id="avatarImg" src="" style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #333; object-fit: cover;">
                </div>
            </div>
        </div>

        <div id="listView" style="display: none;">
            <div class="controls-wrap">
                <div class="controls-bar">
                    <input type="text" id="searchInput" class="search-input" data-vi="Tìm kiếm trò chơi, tác giả..." data-en="Search games, creators..." placeholder="Search games, creators...">
                    <select id="sortSelect" class="sort-select">
                        <option value="recommended" data-vi="Cho bạn" data-en="For You">For You</option>
                        <option value="new" data-vi="Mới nhất" data-en="Newest">Newest</option>
                        <option value="az" data-vi="A-Z" data-en="A-Z">A-Z</option>
                    </select>
                </div>
            </div>
            
            <div id="loader" class="loader" data-vi="Đang tải dữ liệu..." data-en="Loading Indie Vault...">Loading Indie Vault...</div>
            <div class="game-grid" id="gameGrid"></div>
        </div>

        <div id="detailView" style="display: none;">
            <a href="/" class="btn-back" id="t_backBtn" data-vi="← TẤT CẢ GAME" data-en="← ALL GAMES">← ALL GAMES</a>
            <div class="detail-box" id="mainDetailBox">
                <img id="gThumb" src="">
                
                <div class="creator-info">
                    <div>
                        <h2 id="gName" style="margin: 0 0 5px 0; font-size: 24px; letter-spacing: 1px;">--</h2>
                        <div class="dev-name" id="gDevDetail" style="font-size: 14px;"><span data-vi="Phát triển bởi" data-en="A game by">A game by</span> <span id="devNameVal">--</span></div>
                        <div id="gPlatformsDetail" class="platforms"></div>
                    </div>
                    <div id="gCategoryDetail" class="category-tag" style="display: none; margin: 0;"></div>
                </div>

                <div id="gPriceContainer" style="margin-bottom: 15px; display: none;">
                    <span id="gFakePrice" class="fake-price"></span>
                    <span class="free-badge" data-vi="TỰ TRẢ GIÁ / MIỄN PHÍ" data-en="NAME YOUR PRICE / FREE">NAME YOUR PRICE / FREE</span>
                </div>
                
                <div id="customDevContent" style="display: none;"></div>

                <p id="gSize" style="color: #888; font-size: 13px; margin-bottom: 22px;"><span data-vi="Dung lượng:" data-en="Size:">Size:</span> --</p>
                
                <div class="action-container">
                    <div class="support-text" data-vi="Ủng hộ tác giả bằng cách tải xuống qua liên kết an toàn của chúng tôi!" data-en="Support the developer by downloading via our verified link below!">Support the developer by downloading via our verified link below!</div>
                    <div class="action-row">
                        <a href="#" id="gLink" class="btn">
                            <span id="t_downloadBtn" data-vi="TẢI XUỐNG NGAY" data-en="DOWNLOAD NOW">DOWNLOAD NOW</span>
                        </a>
                        <button class="btn-icon" id="shareBtn" title="Copy Link">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                        </button>
                    </div>
                </div>

                <div class="review-box" id="reviewSec" style="display: none;">
                    <b id="t_reviewTitle" style="font-size: 12px; color: #888; letter-spacing: 1px;" data-vi="NHẬT KÝ PHÁT TRIỂN & CỘNG ĐỒNG" data-en="DEVLOG & COMMUNITY">DEVLOG & COMMUNITY</b>
                    <p id="rText" style="font-size: 13px; color: #ddd; line-height: 1.6; margin: 12px 0;"></p>
                    <img id="rImg" class="review-img" style="display: none;">
                </div>

                <div class="recommend-sec">
                    <div class="recommend-title" data-vi="THÊM LỰA CHỌN TƯƠNG TỰ" data-en="MORE LIKE THIS">MORE LIKE THIS</div>
                    <div class="recommend-grid" id="recGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const fConfig = {
            apiKey: "AIzaSyC5LzxgMCOvF01tSMWjoVWt3jjYAnJR394",
            authDomain: "sf2g-bf285.firebaseapp.com",
            projectId: "sf2g-bf285",
            databaseURL: "https://sf2g-bf285-default-rtdb.firebaseio.com",
            storageBucket: "sf2g-bf285.firebasestorage.app",
            messagingSenderId: "982578480996",
            appId: "1:982578480996:web:609acf09d1d5b951299c71",
            measurementId: "G-VD58ECNEPQ"
        };
        if (!firebase.apps.length) firebase.initializeApp(fConfig);[cite: 2]

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                document.getElementById('navLogin').style.display = 'none';
                document.getElementById('navUpload').style.display = 'block';
                
                const profileDiv = document.getElementById('userProfile');
                const avaImg = document.getElementById('avatarImg');
                profileDiv.style.display = 'block';
                
                let dName = user.displayName || "Dev";
                avaImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(dName)}&background=random&rounded=true&color=fff`;[cite: 2]

                profileDiv.onclick = () => {
                    window.location.href = `/?user=${encodeURIComponent(dName)}`;[cite: 2]
                };
            }
        });
    </script>
</body>
</html>
