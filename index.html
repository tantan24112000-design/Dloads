<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dloads</title>
    <style>
        /* Animation hiện dần khi load trang */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body { 
            background: #000; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        
        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            animation: fadeIn 0.4s ease-out; 
        }
        
        h1 { 
            text-align: center; 
            font-size: 24px; 
            letter-spacing: 2px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 15px; 
            margin-bottom: 30px; 
        }
        
        /* Grid danh sách game */
        .game-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 20px; 
        }

        /* Thẻ game đen trắng có animation hover */
        .game-card { 
            background: #0a0a0a; 
            border: 1px solid #333; 
            padding: 15px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: #fff;
        }

        .game-card img { 
            width: 100%; 
            height: 140px; 
            object-fit: cover; 
            border: 1px solid #222; 
            margin-bottom: 12px; 
            transition: opacity 0.25s ease; 
        }

        .game-card:hover img { 
            opacity: 0.85; 
        }

        .game-card h3 { 
            font-size: 16px; 
            margin: 5px 0; 
            color: #fff; 
        }

        .game-card p { 
            color: #888; 
            font-size: 13px; 
            margin-bottom: 15px; 
        }
        
        /* Nút bấm đen trắng tương phản */
        .btn { 
            display: block; 
            background: #fff; 
            color: #000; 
            text-decoration: none; 
            padding: 10px; 
            font-weight: bold; 
            font-size: 13px; 
            border: 1px solid #fff; 
            transition: background 0.2s ease, color 0.2s ease; 
            text-align: center; 
            letter-spacing: 1px;
        }

        .btn:hover { 
            background: #000; 
            color: #fff; 
        }

        .btn-back { 
            display: inline-block; 
            margin-bottom: 20px; 
            background: #111; 
            color: #fff; 
            border: 1px solid #333; 
            padding: 8px 16px; 
            text-decoration: none; 
            font-size: 13px;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .btn-back:hover { 
            border-color: #fff; 
            background: #222; 
        }

        .detail-box { 
            background: #0a0a0a; 
            border: 1px solid #333; 
            padding: 30px; 
            text-align: center; 
            max-width: 400px; 
            margin: 0 auto; 
            animation: fadeIn 0.3s ease-out;
        }

        .detail-box img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
            border: 1px solid #333; 
            margin-bottom: 20px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- DANH SÁCH GAME -->
        <div id="listView" style="display: none;">
            <h1 id="t_mainTitle">DLOADS</h1>
            <div class="game-grid" id="gameGrid">
                <p id="t_loading" style="grid-column: 1/-1; text-align: center;">Loading...</p>
            </div>
        </div>

        <!-- CHI TIẾT GAME -->
        <div id="detailView" style="display: none;">
            <a href="/" class="btn-back" id="t_backBtn">← BACK</a>
            <div class="detail-box">
                <img id="gThumb" src="" alt="Thumbnail">
                <h2 id="gName">Loading...</h2>
                <p id="gSize">Size: --</p>
                <a href="#" id="gLink" class="btn"><span id="t_downloadBtn">DOWNLOAD NOW</span></a>
            </div>
        </div>
    </div>

    <script>
        const dbUrl = "https://sf2g-bf285-default-rtdb.firebaseio.com";
        const urlWebNhiemVu = "https://LINK-WEB-NHAP-CODE-CUA-MAY.vercel.app"; // BẮT BUỘC CÓ https://

        // Nhận diện ngôn ngữ
        const userLang = navigator.language || navigator.userLanguage;
        const isVi = userLang.toLowerCase().includes('vi');

        const i18n = {
            vi: {
                title: "DLOADS - KHO GAME",
                loading: "Đang tải danh sách...",
                empty: "Chưa có game nào trong kho.",
                size: "Dung lượng:",
                select: "CHỌN GAME",
                back: "← QUAY LẠI",
                download: "TẢI GAME NGAY",
                notFound: "Không tìm thấy game!",
                error: "Lỗi tải dữ liệu!"
            },
            en: {
                title: "DLOADS",
                loading: "Loading games...",
                empty: "No games available.",
                size: "Size:",
                select: "SELECT GAME",
                back: "← BACK",
                download: "DOWNLOAD NOW",
                notFound: "Game not found!",
                error: "Data load error!"
            }
        };

        const lang = isVi ? i18n.vi : i18n.en;

        document.getElementById('t_mainTitle').innerText = lang.title;
        document.getElementById('t_loading').innerText = lang.loading;
        document.getElementById('t_backBtn').innerText = lang.back;
        document.getElementById('t_downloadBtn').innerText = lang.download;

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        if (id) {
            document.getElementById('detailView').style.display = 'block';
            fetch(`${dbUrl}/games/${id}.json`)
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        document.getElementById('gName').innerText = data.name;
                        document.getElementById('gSize').innerText = `${lang.size} ${data.size || 'N/A'}`;
                        document.getElementById('gThumb').src = data.img || 'https://via.placeholder.com/400x220?text=No+Image';
                        document.getElementById('gLink').href = `${urlWebNhiemVu}/?id=${id}`;
                    } else {
                        document.getElementById('gName').innerText = lang.notFound;
                    }
                }).catch(() => document.getElementById('gName').innerText = lang.error);
        } else {
            document.getElementById('listView').style.display = 'block';
            fetch(`${dbUrl}/games.json`)
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('gameGrid');
                    grid.innerHTML = '';
                    if (!data) {
                        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center;">${lang.empty}</p>`;
                        return;
                    }
                    for (const gameId in data) {
                        const game = data[gameId];
                        grid.innerHTML += `
                            <div class="game-card">
                                <div>
                                    <img src="${game.img || 'https://via.placeholder.com/300x180?text=No+Image'}" alt="${game.name}">
                                    <h3>${game.name}</h3>
                                    <p>${lang.size} ${game.size || 'N/A'}</p>
                                </div>
                                <a href="?id=${gameId}" class="btn">${lang.select}</a>
                            </div>
                        `;
                    }
                }).catch(() => document.getElementById('gameGrid').innerHTML = `<p style="text-align: center;">${lang.error}</p>`);
        }
    </script>
</body>
</html>
