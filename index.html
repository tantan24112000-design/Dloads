<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://quge5.com/88/tag.min.js" data-zone="277816" async data-cfasync="false"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dloads</title>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        body { background: #000; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { max-width: 850px; margin: 0 auto; animation: fadeIn 0.3s ease-out; }
        
        .header-logo { display: flex; align-items: center; justify-content: center; gap: 10px; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 25px; }
        .header-logo h1 { font-size: 24px; letter-spacing: 2px; margin: 0; }
        .brand-icon { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 2; }

        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .game-card { background: #0a0a0a; border: 1px solid #333; padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
        .game-card:hover { transform: translateY(-4px); border-color: #fff; }
        .game-card img { width: 100%; height: 140px; object-fit: cover; border: 1px solid #222; margin-bottom: 10px; }
        
        .btn { display: block; background: #fff; color: #000; text-decoration: none; padding: 10px; font-weight: bold; font-size: 13px; border: 1px solid #fff; text-align: center; transition: 0.2s; }
        .btn:hover { background: #000; color: #fff; }
        .btn-back { display: inline-block; margin-bottom: 15px; background: #111; color: #fff; border: 1px solid #333; padding: 6px 12px; text-decoration: none; font-size: 13px; }

        .detail-box { background: #0a0a0a; border: 1px solid #333; padding: 25px; text-align: center; max-width: 450px; margin: 0 auto; }
        .detail-box img { width: 100%; height: 220px; object-fit: cover; border: 1px solid #333; margin-bottom: 15px; }

        .review-box { margin-top: 25px; border-top: 1px dashed #333; padding-top: 20px; text-align: left; }
        .stars { color: #fff; letter-spacing: 3px; font-size: 16px; margin-bottom: 8px; }
        .review-img { width: 100%; height: 160px; object-fit: cover; border: 1px solid #333; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER LOGO -->
        <div class="header-logo">
            <svg class="brand-icon" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="3" stroke="#fff" fill="#000"/>
                <path d="M12 7v7m0 0l-3-3m3 3l3-3M8 17h8" stroke="#fff" stroke-linecap="round"/>
            </svg>
            <h1 id="t_mainTitle">DLOADS</h1>
        </div>

        <div id="listView" style="display: none;">
            <div class="game-grid" id="gameGrid"></div>
        </div>

        <div id="detailView" style="display: none;">
            <a href="/" class="btn-back" id="t_backBtn">← BACK</a>
            <div class="detail-box">
                <img id="gThumb" src="">
                <h2 id="gName" style="margin: 5px 0;">--</h2>
                <p id="gSize" style="color: #888; font-size: 13px; margin-bottom: 20px;">Size: --</p>
                <a href="#" id="gLink" class="btn"><span id="t_downloadBtn">DOWNLOAD NOW</span></a>

                <div class="review-box" id="reviewSec" style="display: none;">
                    <b id="t_reviewTitle" style="font-size: 13px; color: #aaa;">COMMUNITY REVIEW</b>
                    <div class="stars">★★★★★ <span style="font-size: 12px; color: #888;">(5.0/5)</span></div>
                    <p id="rText" style="font-size: 13px; color: #ddd; margin: 5px 0;"></p>
                    <img id="rImg" class="review-img" style="display: none;">
                </div>
            </div>
        </div>
    </div>

    <script>
        const dbUrl = "https://sf2g-bf285-default-rtdb.firebaseio.com";
        const urlWebNhiemVu = "https://nhap-code.vercel.app"; // THAY LINK CỦA MÀY VÀO DÒNG NÀY

        const isVi = (navigator.language || '').toLowerCase().includes('vi');
        const lang = {
            title: isVi ? "DLOADS" : "DLOADS",
            back: isVi ? "← QUAY LẠI" : "← BACK",
            dl: isVi ? "TẢI GAME NGAY" : "DOWNLOAD NOW",
            select: isVi ? "CHỌN GAME" : "SELECT GAME",
            review: isVi ? "ĐÁNH GIÁ TỪ NGƯỜI CHƠI" : "COMMUNITY REVIEW"
        };

        document.getElementById('t_mainTitle').innerText = lang.title;
        document.getElementById('t_backBtn').innerText = lang.back;
        document.getElementById('t_downloadBtn').innerText = lang.dl;
        document.getElementById('t_reviewTitle').innerText = lang.review;

        const id = new URLSearchParams(window.location.search).get('id');

        if (id) {
            document.getElementById('detailView').style.display = 'block';
            fetch(`${dbUrl}/games/${id}.json`).then(r => r.json()).then(data => {
                if (data) {
                    document.getElementById('gName').innerText = data.name;
                    document.getElementById('gSize').innerText = `Dung lượng: ${data.size || 'N/A'}`;
                    document.getElementById('gThumb').src = data.img || 'https://via.placeholder.com/400x220?text=No+Image';
                    document.getElementById('gLink').href = `${urlWebNhiemVu}/?id=${id}`;

                    if(data.reviewText || data.reviewImg) {
                        document.getElementById('reviewSec').style.display = 'block';
                        document.getElementById('rText').innerText = data.reviewText || '';
                        if(data.reviewImg) {
                            const rImg = document.getElementById('rImg');
                            rImg.src = data.reviewImg;
                            rImg.style.display = 'block';
                        }
                    }
                }
            });
        } else {
            document.getElementById('listView').style.display = 'block';
            fetch(`${dbUrl}/games.json`).then(r => r.json()).then(data => {
                const grid = document.getElementById('gameGrid');
                for (let gameId in data) {
                    grid.innerHTML += `
                        <div class="game-card">
                            <div>
                                <img src="${data[gameId].img || 'https://via.placeholder.com/300x180'}">
                                <h3 style="font-size:15px; margin:5px 0;">${data[gameId].name}</h3>
                                <p style="color:#888; font-size:12px;">${data[gameId].size||'N/A'}</p>
                            </div>
                            <a href="?id=${gameId}" class="btn">${lang.select}</a>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
