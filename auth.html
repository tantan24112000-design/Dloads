<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dev Login - Dloads</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-box { background: #0a0a0a; border: 1px solid #333; padding: 30px; width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin-bottom: 15px; background: #111; border: 1px solid #333; color: #fff; }
        button { width: 100%; padding: 10px; background: #fff; color: #000; font-weight: bold; border: none; cursor: pointer; margin-bottom: 10px; }
        button:hover { background: #ccc; }
        .switch { font-size: 12px; color: #888; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-box">
    <h2 id="form-title">ĐĂNG NHẬP DEV</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mật khẩu">
    <button id="actionBtn" onclick="handleAuth()">ĐĂNG NHẬP</button>
    <div class="switch" onclick="toggleMode()">Chưa có tài khoản? Đăng ký ngay</div>
</div>

<!-- Thư viện Firebase v8 tương thích -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC5LzxgMCOvF01tSMWjoVWt3jjYAnJR394",
        authDomain: "sf2g-bf285.firebaseapp.com",
        projectId: "sf2g-bf285",
        databaseURL: "https://sf2g-bf285-default-rtdb.firebaseio.com",
        storageBucket: "sf2g-bf285.firebasestorage.app",
        messagingSenderId: "982578480996",
        appId: "1:982578480996:web:609acf09d1d5b951299c71",
        measurementId: "G-VD58ECNEPQ"
    };
    firebase.initializeApp(firebaseConfig);

    let isLogin = true;

    function toggleMode() {
        isLogin = !isLogin;
        document.getElementById('form-title').innerText = isLogin ? "ĐĂNG NHẬP DEV" : "ĐĂNG KÝ DEV";
        document.getElementById('actionBtn').innerText = isLogin ? "ĐĂNG NHẬP" : "ĐĂNG KÝ";
        document.querySelector('.switch').innerText = isLogin ? "Chưa có tài khoản? Đăng ký ngay" : "Đã có tài khoản? Đăng nhập";
    }

    function handleAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;

        if (isLogin) {
            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then(user => { alert("Đăng nhập thành công!"); window.location.href = "upload.html"; })
                .catch(err => alert("Lỗi: " + err.message));
        } else {
            firebase.auth().createUserWithEmailAndPassword(email, pass)
                .then(user => { alert("Đăng ký thành công!"); window.location.href = "upload.html"; })
                .catch(err => alert("Lỗi: " + err.message));
        }
    }
</script>
</body>
</html>
