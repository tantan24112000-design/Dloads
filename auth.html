<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dev Login - Dloads</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-box { background: #0a0a0a; border: 1px solid #333; padding: 30px; width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin-bottom: 15px; background: #111; border: 1px solid #333; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #fff; color: #000; font-weight: bold; border: none; cursor: pointer; margin-bottom: 10px; }
        button:hover { background: #ccc; }
        .switch { font-size: 12px; color: #888; cursor: pointer; text-decoration: underline; }
    </style>
    <script>
        // Check ngôn ngữ trình duyệt tự động (vi hoặc en)
        window.isVN = (navigator.language || navigator.userLanguage || 'en').toLowerCase().startsWith('vi');
        
        window.applyLanguage = function() {
            document.querySelectorAll('[data-vi]').forEach(el => {
                const text = window.isVN ? el.getAttribute('data-vi') : el.getAttribute('data-en');
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.placeholder = text;
                } else {
                    el.innerHTML = text;
                }
            });
        };

        window.addEventListener('DOMContentLoaded', window.applyLanguage);
    </script>
</head>
<body>

<div class="auth-box">
    <h2 id="form-title" data-vi="ĐĂNG NHẬP DEV" data-en="DEV LOGIN">ĐĂNG NHẬP DEV</h2>
    <input type="text" id="username" data-vi="Tên hiển thị (Username)" data-en="Username" placeholder="Tên hiển thị (Username)" style="display: none;">
    <input type="email" id="email" data-vi="Email" data-en="Email" placeholder="Email">
    <input type="password" id="password" data-vi="Mật khẩu" data-en="Password" placeholder="Mật khẩu">
    <button id="actionBtn" onclick="handleAuth()" data-vi="ĐĂNG NHẬP" data-en="LOGIN">ĐĂNG NHẬP</button>
    <div class="switch" onclick="toggleMode()" data-vi="Chưa có tài khoản? Đăng ký ngay" data-en="No account? Register now">Chưa có tài khoản? Đăng ký ngay</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC5LzxgMCOvF01tSMWjoVWt3jjYAnJR394",
        authDomain: "sf2g-bf285.firebaseapp.com",
        projectId: "sf2g-bf285",
        databaseURL: "https://sf2g-bf285-default-rtdb.firebaseio.com",
        storageBucket: "sf2g-bf285.firebasestorage.app",
        messagingSenderId: "982578480996",
        appId: "1:982578480996:web:609acf09d1d5b951299c71",
        measurementId: "G-VD58ECNEPQ"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    let isLogin = true;

    function toggleMode() {
        isLogin = !isLogin;
        const titleEl = document.getElementById('form-title');
        const btnEl = document.getElementById('actionBtn');
        const switchEl = document.querySelector('.switch');
        const userEl = document.getElementById('username');

        if (window.isVN) {
            titleEl.innerText = isLogin ? "ĐĂNG NHẬP" : "ĐĂNG KÝ";
            btnEl.innerText = isLogin ? "ĐĂNG NHẬP" : "ĐĂNG KÝ";
            switchEl.innerText = isLogin ? "Chưa có tài khoản? Đăng ký ngay" : "Đã có tài khoản? Đăng nhập";
        } else {
            titleEl.innerText = isLogin ? "LOGIN" : "REGISTER";
            btnEl.innerText = isLogin ? "LOGIN" : "REGISTER";
            switchEl.innerText = isLogin ? "No account? Register now" : "Have an account? Login";
        }
        userEl.style.display = isLogin ? "none" : "block";
    }

    function handleAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const username = document.getElementById('username').value;

        if (isLogin) {
            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then(user => { 
                    alert(window.isVN ? "Đăng nhập thành công!" : "Login successful!"); 
                    window.location.href = "upload.html"; 
                })
                .catch(err => alert((window.isVN ? "Lỗi: " : "Error: ") + err.message));
        } else {
            if(!username) return alert(window.isVN ? "Bạn phải nhập Username!" : "You must enter a Username!");
            firebase.auth().createUserWithEmailAndPassword(email, pass)
                .then(cred => {
                    return cred.user.updateProfile({ displayName: username }).then(() => {
                        alert(window.isVN ? "Đăng ký thành công!" : "Register successful!"); 
                        window.location.href = "upload.html";
                    });
                })
                .catch(err => alert((window.isVN ? "Lỗi: " : "Error: ") + err.message));
        }
    }
</script>
</body>
</html>
